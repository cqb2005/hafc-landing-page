 facts:['Drain directly into the IVC, unlike portal venous blood which must first pass through liver sinusoids','Lack extrahepatic length — a surgical challenge during liver transplantation and resection','Divide the liver into functional segments used in surgical planning (Couinaud classification)'],
 veinDrainage:'Liver parenchyma', veinTributaries:['Segmental hepatic venous branches'], veinTermination:'Inferior vena cava, just below the diaphragm'},

{id:'w3-renal-vein',name:'Renal Vein',category:'Vein',week:3,region:'Abdomen',wiki:'Renal vein',
 description:'Paired veins draining each kidney into the IVC, with the left renal vein notably longer, crossing anterior to the aorta and receiving the left gonadal and left suprarenal veins.',
 clinical:'The left renal vein can be compressed between the SMA and aorta ("nutcracker syndrome"), causing left flank pain and hematuria.',
 facts:['Left renal vein is longer, crossing anterior to the aorta below the origin of the SMA','Left renal vein receives the left gonadal and left suprarenal veins (asymmetric compared to the right)','Right renal vein is shorter and drains directly into the IVC'],
 veinDrainage:'Kidney (and, on the left, the left gonad and left adrenal gland)', veinTributaries:['Left gonadal vein and left suprarenal vein (left side only)'], veinTermination:'Inferior vena cava'},

{id:'w3-pulmonary-veins',name:'Pulmonary Veins',category:'Vein',week:3,region:'Mediastinum',wiki:'Pulmonary vein',
 description:'Typically four veins (two from each lung) carrying oxygenated blood from the lungs to the left atrium.',
 clinical:'The only veins in the body normally carrying oxygenated blood; a common site of ectopic electrical foci triggering atrial fibrillation, targeted by pulmonary vein isolation ablation.',
 facts:['Normally carry oxygenated blood, unlike all other systemic veins','Typically four veins (superior and inferior from each lung) enter the left atrium separately','Lack valves at their atrial junction, unlike the venae cavae'],
 veinDrainage:'Oxygenated blood from the lung parenchyma (via the pulmonary capillary bed)', veinTributaries:['Segmental pulmonary venous tributaries within each lung'], veinTermination:'Left atrium'},
{id:'w3-esophagus',name:'Esophagus',category:'Organ',week:3,region:'Thorax/abdomen',wiki:'Esophagus',
 description:'Muscular tube approximately 25cm long connecting the pharynx to the stomach, passing through the diaphragm\'s esophageal hiatus at T10.',
 clinical:'Has three natural constrictions (cricopharyngeal, aortic/bronchial, diaphragmatic) that are common sites for foreign body impaction and strictures; its lower third is prone to varices in portal hypertension.',
 facts:['Upper third is skeletal muscle, lower third smooth muscle, middle third mixed','Passes through the diaphragm at T10, alongside the anterior and posterior vagal trunks','Lower esophageal sphincter is a physiological, not truly anatomical, sphincter']},

{id:'w3-stomach',name:'Stomach',category:'Organ',week:3,region:'Abdomen',wiki:'Stomach',
 description:'J-shaped dilated portion of the GI tract between the esophagus and duodenum, comprising the cardia, fundus, body, and pylorus, with lesser and greater curvatures.',
 clinical:'Peptic ulcers occur most commonly along the lesser curvature (gastric) or first part of the duodenum; the posterior stomach relates to the pancreas via the lesser sac (stomach bed).',
 facts:['Greater curvature gives attachment to the greater omentum and gastrosplenic ligament; lesser curvature to the lesser omentum','Pyloric sphincter controls gastric emptying into the duodenum','Rugae (mucosal folds) allow for significant distension']},

{id:'w3-duodenum',name:'Duodenum',category:'Organ',week:3,region:'Abdomen',wiki:'Duodenum',
 description:'First and shortest part of the small intestine (~25cm), C-shaped around the head of the pancreas, divided into four parts (superior, descending, horizontal, ascending).',
 clinical:'The second part receives the common bile duct and pancreatic duct at the major duodenal papilla; the third part can be compressed by the SMA (SMA syndrome).',
 facts:['Mostly retroperitoneal, except the first ~2cm (duodenal cap), which is intraperitoneal','Major duodenal papilla (ampulla of Vater) in the second part is where bile and pancreatic secretions enter','Suspensory ligament of Treitz marks the duodenojejunal junction and the embryological foregut-midgut boundary']},

{id:'w3-jejunum',name:'Jejunum',category:'Organ',week:3,region:'Abdomen',wiki:'Jejunum',
 description:'Proximal two-fifths of the small intestine beyond the duodenum, characterized by thick mucosal folds (plicae circulares) and a relatively empty appearance in life.',
 clinical:'Feeding jejunostomy tubes are placed here in patients unable to tolerate gastric feeding, taking advantage of its distal position from the pylorus and reduced reflux risk.',
 facts:['Has taller, more numerous plicae circulares than the ileum, giving it a "feathery" appearance on imaging','Wall is thicker and more vascular than the ileum, with fewer arcades and longer vasa recta','Located predominantly in the upper left abdominal quadrant']},

{id:'w3-ileum',name:'Ileum',category:'Organ',week:3,region:'Abdomen',wiki:'Ileum',
 description:'Distal three-fifths of the small intestine, terminating at the ileocecal valve, characterized by numerous Peyer\'s patches and a thinner wall than the jejunum.',
 clinical:'Meckel\'s diverticulum, a remnant of the vitelline duct, is found in the ileum (classically within 2 feet of the ileocecal valve); terminal ileum is the primary site of vitamin B12 and bile salt absorption.',
 facts:['Contains numerous Peyer\'s patches (lymphoid follicles), especially in the terminal ileum','Thinner wall and more numerous vascular arcades with shorter vasa recta than the jejunum','Terminal ileum absorbs vitamin B12-intrinsic factor complex and bile salts']},

{id:'w3-cecum',name:'Cecum',category:'Organ',week:3,region:'Right lower abdomen',wiki:'Caecum',
 description:'Blind-ended pouch of the large intestine below the ileocecal valve, continuous superiorly with the ascending colon.',
 clinical:'The most common site of large bowel volvulus after the sigmoid; distension here is a late but dangerous sign of large bowel obstruction (risk of perforation, per Laplace\'s law).',
 facts:['Usually intraperitoneal, though variably fixed','Ileocecal valve regulates flow from the ileum and helps prevent reflux of cecal contents','Gives rise to the appendix from its posteromedial wall']},

{id:'w3-appendix',name:'Appendix',category:'Organ',week:3,region:'Right lower abdomen',wiki:'Appendix (anatomy)',
 description:'Narrow blind-ended tube arising from the posteromedial wall of the cecum, variable in position, containing abundant lymphoid tissue.',
 clinical:'Appendicitis, from luminal obstruction (e.g. by a fecalith), classically presents with periumbilical pain migrating to McBurney\'s point in the right iliac fossa.',
 facts:['Position is highly variable — retrocecal is most common, but pelvic, subcecal, and retroileal positions occur','McBurney\'s point (one-third of the way from the ASIS to the umbilicus) marks its typical base location','Contains abundant lymphoid follicles, especially in adolescence — a "tonsil of the abdomen"']},

{id:'w3-ascending-colon',name:'Ascending Colon',category:'Organ',week:3,region:'Right abdomen',wiki:'Ascending colon',
 description:'Secondarily retroperitoneal segment of the large intestine running superiorly from the cecum to the right (hepatic) flexure.',
 clinical:'Right-sided colon cancers often present later (with anemia from occult bleeding) than left-sided tumors, because the wider lumen and liquid stool here allow tumors to grow without causing obstruction.',
 facts:['Secondarily retroperitoneal — fused to the posterior abdominal wall during development','Supplied by the ileocolic and right colic arteries, branches of the SMA','Turns at the hepatic (right colic) flexure, related to the inferior surface of the liver']},

{id:'w3-transverse-colon',name:'Transverse Colon',category:'Organ',week:3,region:'Upper abdomen',wiki:'Transverse colon',
 description:'Intraperitoneal segment of the large intestine suspended by the transverse mesocolon, running from the hepatic flexure to the splenic flexure.',
 clinical:'The splenic flexure marks the watershed between SMA and IMA territory, making it particularly vulnerable to ischemic colitis during episodes of hypotension.',
 facts:['The most mobile part of the colon, suspended by the transverse mesocolon','Splenic (left colic) flexure is more superior and acute than the hepatic flexure, attached by the phrenicocolic ligament','Straddles the SMA/IMA watershed near the splenic flexure']},

{id:'w3-descending-colon',name:'Descending Colon',category:'Organ',week:3,region:'Left abdomen',wiki:'Descending colon',
 description:'Secondarily retroperitoneal segment of the large intestine running from the splenic flexure to the pelvic brim, where it becomes the sigmoid colon.',
 clinical:'A common site for diverticulosis, though less frequently affected than the sigmoid colon in Western populations.',
 facts:['Secondarily retroperitoneal, like the ascending colon','Supplied by the left colic artery, a branch of the IMA','Narrower in caliber than the ascending colon']},

{id:'w3-sigmoid-colon',name:'Sigmoid Colon',category:'Organ',week:3,region:'Pelvis',wiki:'Sigmoid colon',
 description:'S-shaped intraperitoneal segment of the large intestine suspended by the sigmoid mesocolon, extending from the pelvic brim to the rectum at S3.',
 clinical:'The most common site of colonic diverticulosis/diverticulitis and of sigmoid volvulus, given its mobile mesentery and narrow lumen.',
 facts:['Suspended by the sigmoid mesocolon, giving it a mobile, redundant course','Most common site for diverticular disease in Western populations','Supplied by sigmoid branches of the IMA']},

{id:'w3-rectum',name:'Rectum',category:'Organ',week:3,region:'Pelvis',wiki:'Rectum',
 description:'Terminal ~12-15cm of the large intestine extending from S3 to the anorectal junction, lacking taeniae coli, haustra, and a true mesentery.',
 clinical:'Rectal cancer staging depends heavily on relationship to the peritoneal reflection, since the lower rectum is extraperitoneal and drains differently than the upper (intraperitoneal) rectum, affecting lymphatic spread patterns.',
 facts:['Has three lateral flexures corresponding to internal transverse rectal folds (valves of Houston)','Upper third is covered by peritoneum anteriorly and laterally; lower two-thirds are extraperitoneal','Receives dual blood supply — superior rectal artery (IMA) and middle/inferior rectal arteries (internal iliac)']},
{id:'w3-liver',name:'Liver',category:'Organ',week:3,region:'Right upper abdomen',wiki:'Liver',
 description:'Largest solid organ in the abdomen, divided anatomically into right and left lobes by the falciform ligament and functionally into eight Couinaud segments based on vascular supply.',
 clinical:'Blunt trauma commonly injures the liver given its size and fixed position; cirrhosis distorts its architecture, causing portal hypertension.',
 facts:['Receives a dual blood supply — ~75% from the portal vein (nutrient-rich, low oxygen) and ~25% from the hepatic artery (oxygen-rich)','Functional segments (Couinaud classification) are based on portal/hepatic venous branching, not surface anatomy, and guide surgical resection','Bare area lies in direct contact with the diaphragm, devoid of peritoneum']},

{id:'w3-porta-hepatis',name:'Porta Hepatis',category:'Organ',week:3,region:'Liver',wiki:'Porta hepatis',
 description:'Transverse fissure on the inferior surface of the liver where the portal triad (hepatic artery proper, portal vein, common bile duct) enters/exits, along with hepatic nerves and lymphatics.',
 clinical:'A key surgical landmark; the Pringle maneuver (temporary clamping of structures at the porta hepatis) controls hemorrhage during liver surgery.',
 facts:['Contains the portal triad: bile duct anteriorly-right, hepatic artery anteriorly-left, portal vein posteriorly (mnemonic: "ADP" right to left)','Site of the hepatoduodenal ligament attachment, forming the anterior border of the epiploic foramen','Hepatic lymph nodes cluster here, draining most of the liver']},

{id:'w3-gallbladder',name:'Gallbladder',category:'Organ',week:3,region:'Right upper abdomen',wiki:'Gallbladder',
 description:'Pear-shaped sac on the inferior surface of the liver that stores and concentrates bile, contracting in response to cholecystokinin to release bile into the cystic duct.',
 clinical:'Gallstones (cholelithiasis) can cause biliary colic or, if they obstruct the cystic duct, acute cholecystitis, classically producing Murphy\'s sign on exam.',
 facts:['Divided into fundus, body, and neck (which continues as the cystic duct)','Calot\'s (cystohepatic) triangle, bounded by the cystic duct, common hepatic duct, and liver edge, contains the cystic artery and is a key surgical landmark in cholecystectomy','Fundus projects at the tip of the 9th costal cartilage, at the lateral border of rectus abdominis']},

{id:'w3-cystic-duct',name:'Cystic Duct',category:'Organ',week:3,region:'Biliary tree',wiki:'Cystic duct',
 description:'Short duct connecting the neck of the gallbladder to the common hepatic duct, forming the common bile duct.',
 clinical:'Forms one border of Calot\'s triangle; obstruction by a gallstone here causes acute cholecystitis.',
 facts:['Contains the spiral valve (of Heister), which regulates bile flow into/out of the gallbladder','Joins the common hepatic duct to form the common bile duct','A key structure identified and clipped during laparoscopic cholecystectomy']},

{id:'w3-common-hepatic-duct',name:'Common Hepatic Duct',category:'Organ',week:3,region:'Biliary tree',wiki:'Common hepatic duct',
 description:'Duct formed by the union of the right and left hepatic ducts as they exit the liver at the porta hepatis, joining the cystic duct to form the common bile duct.',
 clinical:'Bile duct injuries during cholecystectomy can involve this structure if the cystic duct is misidentified — a recognized major complication of the procedure.',
 facts:['Formed just below the porta hepatis by union of right and left hepatic ducts','Runs within the hepatoduodenal ligament, anterior to the portal vein','Joins the cystic duct to become the common bile duct']},

{id:'w3-common-bile-duct',name:'Common Bile Duct',category:'Organ',week:3,region:'Biliary tree',wiki:'Common bile duct',
 description:'Duct formed by the union of the common hepatic and cystic ducts, descending posterior to the first part of the duodenum and through the pancreatic head to join the pancreatic duct at the major duodenal papilla.',
 clinical:'Obstruction (by gallstone or pancreatic head tumor) causes painless or painful jaundice; a tumor at the head of the pancreas compressing this duct is a classic cause of the "Courvoisier sign" (palpable, non-tender gallbladder).',
 facts:['Passes posterior to the first part of the duodenum and through (or behind) the head of the pancreas','Joins the main pancreatic duct at the hepatopancreatic ampulla (ampulla of Vater)','Sphincter of Oddi controls flow of bile and pancreatic juice into the duodenum']},

{id:'w3-pancreas',name:'Pancreas',category:'Organ',week:3,region:'Retroperitoneum',wiki:'Pancreas',
 description:'Retroperitoneal gland with both exocrine (digestive enzyme) and endocrine (islets of Langerhans) function, divided into head, neck, body, and tail.',
 clinical:'Acute pancreatitis (often from gallstones or alcohol) causes autodigestion of the gland; pancreatic head tumors can obstruct the common bile duct, causing jaundice.',
 facts:['Head is encircled by the C-shaped duodenum; tail extends to the splenic hilum','Secondarily retroperitoneal except for its tail, which lies within the splenorenal ligament','Islets of Langerhans (endocrine) secrete insulin and glucagon directly into the bloodstream']},

{id:'w3-pancreatic-duct',name:'Pancreatic Duct (Duct of Wirsung)',category:'Organ',week:3,region:'Pancreas',wiki:'Pancreatic duct',
 description:'Main duct running the length of the pancreas from tail to head, joining the common bile duct at the hepatopancreatic ampulla to drain into the duodenum.',
 clinical:'Pancreatic duct obstruction (stones, strictures, or tumor) is a cause of chronic pancreatitis and pancreatic pain; ERCP allows direct visualization and intervention on this duct.',
 facts:['Also called the duct of Wirsung','Usually joins the common bile duct just before the major duodenal papilla, sharing the sphincter of Oddi','An accessory pancreatic duct (of Santorini) drains the head separately via the minor duodenal papilla in most people']},

{id:'w3-spleen',name:'Spleen',category:'Organ',week:3,region:'Left upper abdomen',wiki:'Spleen',
 description:'Largest lymphoid organ in the body, located in the left hypochondrium beneath ribs 9-11, involved in blood filtration, old red cell removal, and immune surveillance.',
 clinical:'The most commonly injured organ in blunt abdominal trauma given its friable capsule and rib protection is incomplete; splenectomy increases lifelong risk of infection with encapsulated organisms (post-splenectomy sepsis).',
 facts:['Intraperitoneal, connected to the stomach by the gastrosplenic ligament and to the kidney by the splenorenal (lienorenal) ligament','Contains red pulp (filters blood, removes old RBCs) and white pulp (lymphoid tissue, immune function)','Protected by ribs 9-11 but still the most commonly injured organ in blunt abdominal trauma']},

{id:'w3-kidney',name:'Kidney',category:'Organ',week:3,region:'Retroperitoneum',wiki:'Kidney',
 description:'Paired bean-shaped retroperitoneal organ responsible for filtration of blood and formation of urine, with an outer cortex and inner medulla drained by the renal pelvis.',
 clinical:'The right kidney sits slightly lower than the left due to the liver; renal colic from ureteric stones causes classic flank-to-groin pain following the course of the ureter.',
 facts:['Right kidney lies slightly lower than the left due to the liver above it','Hilum transmits, from anterior to posterior, the renal vein, renal artery, and renal pelvis/ureter ("VAP")','Surrounded by perirenal fat and enclosed within the renal (Gerota\'s) fascia']},

{id:'w3-ureter',name:'Ureter',category:'Organ',week:3,region:'Retroperitoneum/pelvis',wiki:'Ureter',
 description:'Muscular tube (~25-30cm) carrying urine from the renal pelvis to the bladder, running retroperitoneally and crossing the pelvic brim at the bifurcation of the common iliac artery.',
 clinical:'Has three natural constrictions — the ureteropelvic junction, pelvic brim (crossing the iliac vessels), and ureterovesical junction — the most common sites for kidney stones to lodge.',
 facts:['Crosses anterior to the bifurcation of the common iliac artery at the pelvic brim','In females, passes under the uterine artery near the cervix ("water under the bridge") — at risk during hysterectomy','Peristaltic contractions actively propel urine toward the bladder']},

{id:'w3-adrenal-gland',name:'Adrenal (Suprarenal) Gland',category:'Organ',week:3,region:'Retroperitoneum',wiki:'Adrenal gland',
 description:'Paired retroperitoneal endocrine gland sitting atop each kidney, composed of an outer cortex (mineralocorticoids, glucocorticoids, androgens) and inner medulla (catecholamines).',
 clinical:'Pheochromocytoma (a catecholamine-secreting medullary tumor) causes episodic hypertension, palpitations, and sweating; adrenal insufficiency (Addison\'s disease) results from cortical destruction.',
 facts:['Right gland is pyramidal and sits more superiorly, related to the IVC; left gland is crescentic, related to the aorta','Cortex derives from mesoderm; medulla derives from neural crest cells (modified sympathetic ganglion)','Drained by a single central vein on each side — right drains directly into the IVC, left into the left renal vein']},
{id:'w3-falciform-ligament',name:'Falciform Ligament',category:'Ligament',week:3,region:'Liver/anterior abdominal wall',wiki:'Falciform ligament',
 description:'Sickle-shaped double fold of peritoneum connecting the anterior surface of the liver to the anterior abdominal wall and diaphragm, dividing the liver into anatomical right and left lobes.',
 clinical:'Contains the ligamentum teres hepatis in its free inferior edge; recanalized paraumbilical veins here can form "caput medusae" in portal hypertension.',
 facts:['Marks the anatomical division between right and left liver lobes (different from the functional Couinaud division)','Extends from the liver to the diaphragm and umbilicus','Free inferior edge contains the ligamentum teres hepatis (obliterated umbilical vein)'],
 ligAttachments:['Anterior/superior surface of the liver to the anterior abdominal wall and diaphragm, extending to the umbilicus'],
 ligFunction:'Anchors the liver to the anterior abdominal wall and diaphragm; anatomically separates the right and left lobes'},

{id:'w3-ligamentum-teres',name:'Ligamentum Teres Hepatis',category:'Ligament',week:3,region:'Liver',wiki:'Ligamentum teres hepatis',
 description:'Fibrous cord within the free edge of the falciform ligament representing the obliterated left umbilical vein of the fetal circulation.',
 clinical:'Can be recanalized in severe portal hypertension to carry blood from the portal system to periumbilical veins, producing visible distended paraumbilical veins (caput medusae).',
 facts:['Represents the obliterated umbilical vein, which carried oxygenated blood from the placenta in fetal life','Runs within the free inferior edge of the falciform ligament','Passes through a shallow groove on the visceral surface of the liver'],
 ligAttachments:['Umbilicus to the porta hepatis/left branch of the portal vein, within the falciform ligament'],
 ligFunction:'Fibrous remnant with no significant mechanical function in postnatal life; potential collateral pathway in portal hypertension'},

{id:'w3-coronary-ligament',name:'Coronary Ligament of Liver',category:'Ligament',week:3,region:'Liver/diaphragm',wiki:'Coronary ligament',
 description:'Peritoneal reflection connecting the posterior/superior surface of the liver to the diaphragm, whose anterior and posterior layers enclose the non-peritonealized "bare area" of the liver.',
 clinical:'The bare area it encloses is a potential route for infection/abscess to spread directly between the liver and the retroperitoneum, bypassing the peritoneal cavity.',
 facts:['Anterior and posterior layers enclose the bare area of the liver, devoid of peritoneum','Continuous laterally with the right and left triangular ligaments','Formed by the reflection of peritoneum from the diaphragm onto the liver'],
 ligAttachments:['Posterosuperior surface of the liver to the inferior surface of the diaphragm'],
 ligFunction:'Anchors the liver to the diaphragm and delineates the bare area'},

{id:'w3-lesser-omentum',name:'Lesser Omentum',category:'Ligament',week:3,region:'Upper abdomen',wiki:'Lesser omentum',
 description:'Double layer of peritoneum connecting the lesser curvature of the stomach and the first part of the duodenum to the liver, comprising the hepatogastric and hepatoduodenal ligaments.',
 clinical:'Its free right edge (the hepatoduodenal ligament) contains the portal triad and forms the anterior border of the epiploic foramen (of Winslow), the entry point to the lesser sac.',
 facts:['Hepatogastric ligament (left part) connects the liver to the stomach','Hepatoduodenal ligament (right, free-edge part) connects the liver to the duodenum and contains the portal triad','Forms the anterior boundary of the epiploic foramen, the sole entrance to the lesser sac'],
 ligAttachments:['Lesser curvature of the stomach and first part of duodenum to the porta hepatis of the liver'],
 ligFunction:'Suspends the stomach/duodenum from the liver and transmits the portal triad to the liver'},

{id:'w3-greater-omentum',name:'Greater Omentum',category:'Ligament',week:3,region:'Abdomen',wiki:'Greater omentum',
 description:'Large, fatty, apron-like double fold of peritoneum hanging from the greater curvature of the stomach, draping over the transverse colon and small intestine.',
 clinical:'Known as the "abdominal policeman" for its tendency to migrate to and wall off sites of intra-abdominal inflammation (e.g. appendicitis), limiting the spread of infection.',
 facts:['Contains the gastro-omental (gastroepiploic) vessels along its attached border to the stomach','Rich in fat and macrophage-containing "milky spots," contributing to peritoneal immune defense','Can adhere to and wall off inflamed viscera, limiting peritonitis spread'],
 ligAttachments:['Greater curvature of the stomach and first part of duodenum, draping down over the transverse colon and small bowel'],
 ligFunction:'Provides immune surveillance/containment of intra-abdominal infection and insulates/cushions abdominal viscera'},

{id:'w3-gastrosplenic-ligament',name:'Gastrosplenic Ligament',category:'Ligament',week:3,region:'Left upper abdomen',wiki:'Gastrosplenic ligament',
 description:'Peritoneal fold connecting the greater curvature of the stomach to the hilum of the spleen, carrying the short gastric and left gastro-omental vessels.',
 clinical:'Must be divided (ligating the short gastric vessels) during splenectomy, with care to avoid injuring the adjacent stomach wall.',
 facts:['Forms part of the left boundary of the lesser sac','Carries the short gastric arteries and left gastro-omental (gastroepiploic) vessels','Continuous with the greater omentum inferiorly'],
 ligAttachments:['Greater curvature of the stomach to the splenic hilum'],
 ligFunction:'Suspends the spleen from the stomach and transmits the short gastric vessels'},

{id:'w3-splenorenal-ligament',name:'Splenorenal (Lienorenal) Ligament',category:'Ligament',week:3,region:'Left upper abdomen',wiki:'Splenorenal ligament',
 description:'Peritoneal fold connecting the hilum of the spleen to the anterior surface of the left kidney, carrying the splenic vessels and the tail of the pancreas.',
 clinical:'The tail of the pancreas lies within this ligament, so it can be inadvertently injured during splenectomy if not carefully dissected free.',
 facts:['Uniquely contains the tail of the pancreas within its layers, unlike most other peritoneal ligaments','Carries the splenic artery and vein to/from the spleen','Forms part of the posterior boundary of the lesser sac'],
 ligAttachments:['Hilum of the spleen to the anterior surface of the left kidney'],
 ligFunction:'Suspends the spleen from the posterior abdominal wall and transmits the splenic vessels and pancreatic tail'},

{id:'w3-ligament-of-treitz',name:'Suspensory Ligament of Duodenum (Ligament of Treitz)',category:'Ligament',week:3,region:'Duodenojejunal junction',wiki:'Suspensory muscle of duodenum',

/* ======================= APP LOGIC ======================= */
const STORAGE_KEY = 'anatomyFlashcardsState_v1';
const FILTER_KEY = 'anatomyFlashcardsFilters_v1';
const IMG_CACHE_PREFIX = 'af_img_';

let score = {correct:0, incorrect:0};
let status = {};
let filters = {week:'all', categories: new Set(CATEGORIES), mode:'sequential'};

let workingSet = [];
let order = [];
let pos = 0;
let imgToken = 0;

const progressEl = document.getElementById('progress');
const scoreCorrectEl = document.getElementById('scoreCorrect');
const scoreIncorrectEl = document.getElementById('scoreIncorrect');
const cardFront = document.getElementById('cardFront');
const cardBack = document.getElementById('cardBack');
const backContent = document.getElementById('backContent');
const imgEl = document.getElementById('cardImg');
const imgFallback = document.getElementById('imgFallback');
const imgCredit = document.getElementById('imgCredit');
const categoryFiltersEl = document.getElementById('categoryFilters');
const weekFilterEl = document.getElementById('weekFilter');
const resetBtn = document.getElementById('resetProgress');
const btnCorrect = document.getElementById('btnCorrect');
const btnIncorrect = document.getElementById('btnIncorrect');

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      score = s.score || score;
      status = s.status || {};
    }
  }catch(e){}
  try{
    const rawF = localStorage.getItem(FILTER_KEY);
    if(rawF){
      const f = JSON.parse(rawF);
      filters.week = f.week || 'all';
      filters.mode = f.mode || 'sequential';
      if(Array.isArray(f.categories)) filters.categories = new Set(f.categories);
    }
  }catch(e){}
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({score, status}));
}
function saveFilters(){
  localStorage.setItem(FILTER_KEY, JSON.stringify({week:filters.week, mode:filters.mode, categories:[...filters.categories]}));
}

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function ul(arr){ return (arr && arr.length) ? '<ul>'+arr.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>' : ''; }

function buildCategoryCheckboxes(){
  categoryFiltersEl.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const id = 'cat-'+cat;
    const label = document.createElement('label');
    label.innerHTML = '<input type="checkbox" id="'+id+'" '+(filters.categories.has(cat)?'checked':'')+'> '+cat;
    label.querySelector('input').addEventListener('change', e=>{
      if(e.target.checked) filters.categories.add(cat); else filters.categories.delete(cat);
      saveFilters();
      applyFilters();
    });
    categoryFiltersEl.appendChild(label);
  });
}
function syncCheckboxes(){
  CATEGORIES.forEach(cat=>{
    const el = document.getElementById('cat-'+cat);
    if(el) el.checked = filters.categories.has(cat);
  });
}

function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
}

function applyFilters(){
  workingSet = CARDS.filter(c=>{
    if(filters.week!=='all' && String(c.week)!==String(filters.week)) return false;
    if(!filters.categories.has(c.category)) return false;
    if(filters.mode==='review' && status[c.id]!=='incorrect') return false;
    return true;
  });
  order = workingSet.map((_,i)=>i);
  if(filters.mode==='random') shuffleArray(order);
  pos = 0;
  render();
}

function currentCard(){ return workingSet[order[pos]]; }

function showFront(){ cardFront.hidden=false; cardBack.hidden=true; }
function showBack(){ cardFront.hidden=true; cardBack.hidden=false; }
function flip(){ if(cardFront.hidden) showFront(); else showBack(); }

async function loadImage(card){
  const token = ++imgToken;
  imgEl.style.display='none';
  imgEl.removeAttribute('src');
  imgFallback.hidden = true;
  imgCredit.textContent = 'Loading image…';
  const cacheKey = IMG_CACHE_PREFIX + card.wiki;
  let cached;
  try{ cached = localStorage.getItem(cacheKey); }catch(e){}
  if(cached){
    if(token!==imgToken) return;
    applyImg(cached);
    return;
  }
  try{
    const url = 'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(card.wiki.replace(/ /g,'_'));
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('not found');
    const data = await resp.json();
    const src = (data.originalimage && data.originalimage.source) || (data.thumbnail && data.thumbnail.source);
    if(!src) throw new Error('no image');
    try{ localStorage.setItem(cacheKey, src); }catch(e){}
    if(token!==imgToken) return;
    applyImg(src);
  }catch(e){
    if(token!==imgToken) return;
    imgCredit.textContent = '';
    imgFallback.hidden = false;
    imgFallback.textContent = 'Image unavailable (offline, or no Wikipedia image found for "'+card.wiki+'"). See back of card for full details.';
  }
}
function applyImg(src){
  imgEl.src = src;
  imgEl.style.display='block';
  imgCredit.textContent = 'Image: Wikipedia / Wikimedia Commons';
}

function buildBack(card){
  let h = '';
  h += '<h2>'+esc(card.name)+'</h2>';
  h += '<div class="tag-row"><span class="tag">'+esc(card.category)+'</span><span class="tag">Week '+esc(card.week)+'</span><span class="tag">'+esc(card.region)+'</span></div>';
  h += '<p class="desc">'+esc(card.description)+'</p>';

  if(card.origin){
    h += '<h3>Origin</h3>'+ul(card.origin);
    h += '<h3>Insertion</h3>'+ul(card.insertion);
    h += '<h3>Action</h3>'+ul(card.action);
    h += '<h3>Innervation</h3><p>'+esc(card.innervation)+'</p>';
    if(card.bloodSupply) h += '<h3>Blood Supply</h3><p>'+esc(card.bloodSupply)+'</p>';
  }
  if(card.roots){
    h += '<h3>Roots</h3><p>'+esc(card.roots)+'</p>';
    h += '<h3>Course</h3><p>'+esc(card.course)+'</p>';
    h += '<h3>Motor Supply</h3><p>'+esc(card.motorSupply)+'</p>';
    h += '<h3>Sensory Supply</h3><p>'+esc(card.sensorySupply)+'</p>';
    h += '<h3>Major Branches</h3>'+ul(card.branches);
  }
  if(card.arteryOrigin){
    h += '<h3>Origin</h3><p>'+esc(card.arteryOrigin)+'</p>';
    h += '<h3>Branches</h3>'+ul(card.arteryBranches);
    h += '<h3>Areas Supplied</h3><p>'+esc(card.areasSupplied)+'</p>';
  }
  if(card.veinDrainage){
    h += '<h3>Drainage</h3><p>'+esc(card.veinDrainage)+'</p>';
    h += '<h3>Tributaries</h3>'+ul(card.veinTributaries);
    h += '<h3>Termination</h3><p>'+esc(card.veinTermination)+'</p>';
  }
  if(card.ligAttachments){
    h += '<h3>Attachments</h3>'+ul(card.ligAttachments);
    h += '<h3>Function</h3><p>'+esc(card.ligFunction)+'</p>';
  }
  if(card.jointType){
    h += '<h3>Joint Type</h3><p>'+esc(card.jointType)+'</p>';
    h += '<h3>Articulations</h3><p>'+esc(card.articulations)+'</p>';
    h += '<h3>Movements</h3>'+ul(card.movements);
    h += '<h3>Supporting Ligaments</h3>'+ul(card.supportingLigaments);
  }
  if(card.boneLandmarks){
    h += '<h3>Major Landmarks</h3>'+ul(card.boneLandmarks);
    h += '<h3>Articulations</h3>'+ul(card.boneArticulations);
    h += '<h3>Important Attachments</h3>'+ul(card.boneAttachments);
  }
  if(card.facts && card.facts.length) h += '<h3>Key Facts</h3>'+ul(card.facts);
  if(card.clinical) h += '<h3>Clinical Significance</h3><p>'+esc(card.clinical)+'</p>';
  return h;
}

function updateMarkButtons(card){
  btnCorrect.classList.toggle('active-status', status[card.id]==='correct');
  btnIncorrect.classList.toggle('active-status', status[card.id]==='incorrect');
}

function render(){
  scoreCorrectEl.textContent = 'Correct: '+score.correct;
  scoreIncorrectEl.textContent = 'Incorrect: '+score.incorrect;
  if(!workingSet.length){
    progressEl.textContent = '0 / 0';
    backContent.innerHTML = '<p>No cards match the current filters.</p>';
    imgEl.style.display='none';
    imgFallback.hidden = false;
    imgFallback.textContent = 'No cards match the current filters.';
    imgCredit.textContent='';
    showFront();
    return;
  }
  const card = currentCard();
  progressEl.textContent = (pos+1)+' / '+workingSet.length;
  showFront();
  loadImage(card);
  backContent.innerHTML = buildBack(card);
  updateMarkButtons(card);
}

function next(){ if(!workingSet.length) return; pos = (pos+1) % workingSet.length; render(); }
function prev(){ if(!workingSet.length) return; pos = (pos-1+workingSet.length) % workingSet.length; render(); }
function shuffleNow(){ if(!workingSet.length) return; shuffleArray(order); pos=0; render(); }

function mark(result){
  const card = currentCard();
  if(!card) return;
  const prevStatus = status[card.id];
  if(prevStatus==='correct') score.correct = Math.max(0,score.correct-1);
  if(prevStatus==='incorrect') score.incorrect = Math.max(0,score.incorrect-1);
  status[card.id] = result;
  if(result==='correct') score.correct++; else score.incorrect++;
  saveState();
  scoreCorrectEl.textContent = 'Correct: '+score.correct;
  scoreIncorrectEl.textContent = 'Incorrect: '+score.incorrect;
  updateMarkButtons(card);
  setTimeout(next, 150);
}

document.getElementById('btnFlip').addEventListener('click', flip);
document.getElementById('btnPrev').addEventListener('click', prev);
document.getElementById('btnNext').addEventListener('click', next);
document.getElementById('btnShuffle').addEventListener('click', shuffleNow);
btnCorrect.addEventListener('click', ()=>mark('correct'));
btnIncorrect.addEventListener('click', ()=>mark('incorrect'));

weekFilterEl.addEventListener('change', e=>{ filters.week = e.target.value; saveFilters(); applyFilters(); });

document.querySelectorAll('input[name="mode"]').forEach(r=>{
  r.addEventListener('change', e=>{
    if(e.target.checked){ filters.mode = e.target.value; saveFilters(); applyFilters(); }
  });
});

document.querySelectorAll('#quickFilters [data-quick]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const q = btn.dataset.quick;
    if(q==='all') filters.categories = new Set(CATEGORIES);
    else if(q==='Vessel') filters.categories = new Set(['Artery','Vein']);
    else filters.categories = new Set([q]);
    syncCheckboxes();
    saveFilters();
    applyFilters();
  });
});

resetBtn.addEventListener('click', ()=>{
  if(confirm('Reset all progress (score and correct/incorrect marks)? This cannot be undone.')){
    score = {correct:0, incorrect:0};
    status = {};
    saveState();
    applyFilters();
  }
});

document.addEventListener('keydown', e=>{
  if(e.target.tagName==='SELECT' || e.target.tagName==='INPUT') return;
  if(e.code==='Space'){ e.preventDefault(); flip(); }
  else if(e.code==='ArrowRight'){ next(); }
  else if(e.code==='ArrowLeft'){ prev(); }
  else if(e.key==='c' || e.key==='C'){ mark('correct'); }
  else if(e.key==='x' || e.key==='X'){ mark('incorrect'); }
});

loadState();
buildCategoryCheckboxes();
weekFilterEl.value = filters.week;
document.querySelector('input[name="mode"][value="'+filters.mode+'"]').checked = true;
applyFilters();
</script>
