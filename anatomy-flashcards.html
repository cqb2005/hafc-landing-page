 facts:['Located at the junction of the transverse process and lamina/pedicle','Gives attachment to the medial fibers of longissimus thoracis and the intertransverse ligament','Distinguishes lumbar from thoracic transverse processes'],
 boneLandmarks:['Small tubercle at the base of the transverse process'], boneArticulations:['None'],
 boneAttachments:['Longissimus thoracis (medial fibers), intertransverse ligament']},

{id:'w2-pars-interarticularis',name:'Pars Interarticularis',category:'Bone',week:2,region:'Lumbar vertebra',wiki:'Pars interarticularis',
 description:'The narrow bony segment of the vertebral arch between the superior and inferior articular processes.',
 clinical:'A common site of stress fracture (spondylolysis), most frequent at L5, which can progress to spondylolisthesis (anterior slippage of the vertebral body).',
 facts:['Most vulnerable lumbar level is L5','Repetitive hyperextension (gymnastics, fast bowling) is a major risk factor','Bilateral pars defects are required for true spondylolisthesis'],
 boneLandmarks:['Isthmus between the superior and inferior articular processes'], boneArticulations:['Not itself articular — connects the articular processes'],
 boneAttachments:['None significant']},

{id:'w2-sacrum',name:'Sacrum',category:'Bone',week:2,region:'Pelvis/lumbosacral junction',wiki:'Sacrum',
 description:'Large triangular bone formed by fusion of five sacral vertebrae, forming the posterior wall of the pelvis and the base of the vertebral column.',
 clinical:'The sacral promontory is a key obstetric landmark for pelvic diameter measurement; sacral fractures can damage the sacral plexus/cauda equina.',
 facts:['Base articulates with L5 at the lumbosacral joint','Ala (wing) provides attachment for iliacus and the psoas minor tendon','Anterior and posterior sacral foramina transmit the sacral nerve rami'],
 boneLandmarks:['Sacral promontory, ala, median sacral crest, sacral foramina, sacral hiatus'],
 boneArticulations:['L5 vertebra (lumbosacral joint), ilium bilaterally (sacroiliac joints), coccyx'],
 boneAttachments:['Iliolumbar ligament, sacrotuberous and sacrospinous ligaments, erector spinae, multifidus']},

{id:'w2-iliac-crest',name:'Iliac Crest',category:'Bone',week:2,region:'Pelvis',wiki:'Iliac crest',
 description:'Superior curved margin of the ilium extending from the anterior superior to the posterior superior iliac spine.',
 clinical:'A common site for bone marrow biopsy/harvest and a palpable landmark used to identify the L4 vertebral level (Tuffier\'s line) for lumbar puncture.',
 facts:['Highest point corresponds approximately to the L4 spinous process level (supracristal line)','Gives attachment to the abdominal wall muscles and latissimus dorsi','Site of the iliolumbar ligament and quadratus lumborum origin'],
 boneLandmarks:['Anterior superior iliac spine, posterior superior iliac spine, tubercle of the crest'],
 boneArticulations:['None directly — part of the ilium'],
 boneAttachments:['External/internal oblique, transversus abdominis, latissimus dorsi, quadratus lumborum, iliolumbar ligament']},

{id:'w2-psis',name:'Posterior Superior Iliac Spine (PSIS)',category:'Bone',week:2,region:'Pelvis',wiki:'Posterior superior iliac spine',
 description:'Posterior projection at the end of the iliac crest, marked by a skin dimple in most people.',
 clinical:'Visible/palpable skin dimples overlying the PSIS bilaterally identify the S2 vertebral level and the sacroiliac joint for injections.',
 facts:['Marks the S2 vertebral level and the middle of the sacroiliac joint','Site of attachment for the posterior sacroiliac ligaments and multifidus','Landmark for posterior iliac crest bone graft harvest'],
 boneLandmarks:['Palpable posterior dimple'], boneArticulations:['None directly'],
 boneAttachments:['Posterior sacroiliac ligament, multifidus, long posterior sacroiliac ligament']},

{id:'w2-sacral-promontory',name:'Sacral Promontory',category:'Bone',week:2,region:'Lumbosacral junction',wiki:'Sacral promontory',
 description:'Anterosuperior projecting edge of the body of S1, forming a prominent bony landmark at the lumbosacral junction.',
 clinical:'Key obstetric landmark used to measure the diagonal conjugate (pelvic inlet diameter) during clinical pelvimetry.',
 facts:['Marks the posterior boundary of the pelvic inlet','The sympathetic trunk and superior hypogastric plexus cross anteriorly at this level','Corresponds to the L5-S1 disc level'],
 boneLandmarks:['Prominent anterior lip of the S1 body'], boneArticulations:['Continuous with the L5 vertebral body via the lumbosacral disc'],
 boneAttachments:['Anterior longitudinal ligament, iliolumbar ligament fibers']},

{id:'w2-coccyx',name:'Coccyx',category:'Bone',week:2,region:'Pelvis',wiki:'Coccyx',
 description:'Small triangular bone formed by fusion of 3-5 rudimentary coccygeal vertebrae, articulating with the apex of the sacrum.',
 clinical:'Coccydynia (tailbone pain) commonly follows a fall onto the coccyx or childbirth trauma; fracture/dislocation is diagnosed with lateral radiographs in flexion/extension.',
 facts:['Represents the vestigial tail in humans','Gluteus maximus and the anal sphincter/levator ani attach here','Sacrococcygeal joint permits slight movement during defecation and childbirth'],
 boneLandmarks:['Coccygeal cornu articulating with the sacral cornu'], boneArticulations:['Sacrum, at the sacrococcygeal joint'],
 boneAttachments:['Gluteus maximus, coccygeus, anococcygeal ligament, external anal sphincter']},

{id:'w2-lumbar-facet-joint',name:'Lumbar Facet Joint',category:'Joint',week:2,region:'Lumbar spine',wiki:'Zygapophyseal joint',
 description:'Synovial plane joint between the articular processes of adjacent lumbar vertebrae, oriented in a near-sagittal plane.',
 clinical:'A frequent source of chronic low back pain (facet syndrome); the near-sagittal orientation favors flexion/extension but strongly resists rotation, protecting the discs from torsional injury.',
 facts:['Sagittal orientation permits flexion/extension and limits axial rotation','Richly innervated by medial branches of the dorsal rami — the target of facet injections/rhizotomy','L5-S1 facets are more coronally oriented, resisting anterior shear'],
 jointType:'Synovial plane joint', articulations:'Inferior articular process of the vertebra above with the superior articular process of the vertebra below',
 movements:['Flexion and extension of the lumbar spine','Limited rotation'], supportingLigaments:['Joint capsule','Ligamentum flavum']},

{id:'w2-lumbosacral-joint',name:'Lumbosacral Joint',category:'Joint',week:2,region:'Lumbosacral junction',wiki:'Lumbosacral joint',
 description:'Junction between the L5 vertebra and the base of the sacrum, combining a secondary cartilaginous joint (L5-S1 disc) with paired synovial facet joints.',
 clinical:'A major biomechanical transition point subject to high shear stress; a common site for spondylolisthesis and disc herniation given the abrupt change in facet orientation.',
 facts:['L5-S1 disc is wedge-shaped, contributing to the lumbosacral angle','Facet orientation shifts to a more coronal plane here, resisting anterior slippage of L5 on S1','Iliolumbar ligament provides additional stabilization at this level'],
 jointType:'Combined secondary cartilaginous joint (disc) and synovial facet joints', articulations:'Body of L5 with the base of the sacrum (disc) and the L5-S1 facet joints',
 movements:['Flexion/extension','Slight lateral flexion','Minimal rotation'], supportingLigaments:['Iliolumbar ligament','Anterior/posterior longitudinal ligaments','Facet joint capsules']},

{id:'w2-sacroiliac-joint',name:'Sacroiliac Joint',category:'Joint',week:2,region:'Pelvis',wiki:'Sacroiliac joint',
 description:'Large synovial and syndesmotic joint between the auricular surfaces of the sacrum and ilium, transmitting load between the spine and lower limbs.',
 clinical:'A common source of low back/buttock pain (sacroiliac joint dysfunction); widens during pregnancy under hormonal influence (relaxin) to facilitate delivery.',
 facts:['Combines a synovial component anteriorly with a strong syndesmosis posteriorly, making it one of the strongest joints in the body','Very limited mobility in adults, primarily providing stress absorption','Innervated by the posterior rami of L4-S3'],
 jointType:'Combined synovial and syndesmotic (fibrous) joint', articulations:'Auricular surface of the sacrum with the auricular surface of the ilium',
 movements:['Minimal gliding/nutation-counternutation movement'], supportingLigaments:['Anterior sacroiliac ligament','Posterior sacroiliac ligament','Interosseous sacroiliac ligament','Sacrotuberous and sacrospinous ligaments']},

{id:'w2-l5s1-disc',name:'Lumbosacral Intervertebral Disc (L5-S1)',category:'Joint',week:2,region:'Lumbosacral junction',wiki:'Intervertebral disc',
 description:'Wedge-shaped intervertebral disc between L5 and S1, thicker anteriorly than posteriorly, contributing to the lumbosacral angle.',
 clinical:'The L5-S1 and L4-L5 levels account for the great majority of lumbar disc herniations due to the high mechanical stress concentrated at this transition zone.',
 facts:['Wedge shape helps create the normal lumbosacral angle (~130-160°)','Bears the highest compressive and shear loads of any disc in the spine','Herniation here classically compresses the S1 nerve root, affecting the ankle jerk reflex and plantar flexion'],
 jointType:'Secondary cartilaginous joint (symphysis)', articulations:'Body of L5 with the base of the sacrum',
 movements:['Compressive shock absorption','Minor gliding contributing to lumbosacral flexion/extension'], supportingLigaments:['Anterior longitudinal ligament','Posterior longitudinal ligament','Iliolumbar ligament']},

{id:'w2-iliolumbar-ligament',name:'Iliolumbar Ligament',category:'Ligament',week:2,region:'Lumbosacral junction',wiki:'Iliolumbar ligament',
 description:'Strong triangular ligament connecting the transverse process of L5 (and often L4) to the iliac crest.',
 clinical:'A major stabilizer of the lumbosacral junction; degeneration or laxity is implicated as a source of chronic low back pain at this level.',
 facts:['Considered by some anatomists a thickened, specialized part of the quadratus lumborum fascia rather than a true independent ligament','Limits excessive movement of L5 on the sacrum/ilium','Well developed only after childhood, forming with maturation'],
 ligAttachments:['Transverse process of L5 (and L4) to the iliac crest'],
 ligFunction:'Stabilizes the lumbosacral junction, limiting flexion, extension, and lateral flexion of L5 on the sacrum'},

{id:'w2-anterior-si-ligament',name:'Anterior Sacroiliac Ligament',category:'Ligament',week:2,region:'Sacroiliac joint',wiki:'Anterior sacroiliac ligament',
 description:'Thin ligament spanning the anterior and inferior margins of the sacroiliac joint.',
 clinical:'The weakest of the sacroiliac ligaments, making the joint most vulnerable to anterior stress and a common site for pregnancy-related laxity/pain.',
 facts:['Essentially a thickening of the anterior joint capsule','Weaker than the posterior and interosseous sacroiliac ligaments','Relaxes under hormonal influence during pregnancy'],
 ligAttachments:['Anterior sacrum to the anterior ilium, across the sacroiliac joint'],
 ligFunction:'Provides limited anterior stabilization of the sacroiliac joint'},

{id:'w2-posterior-si-ligament',name:'Posterior Sacroiliac Ligament',category:'Ligament',week:2,region:'Sacroiliac joint',wiki:'Posterior sacroiliac ligament',
 description:'Strong ligament complex (short and long fibers) spanning the posterior aspect of the sacroiliac joint.',
 clinical:'A key stabilizer preventing the sacrum from tilting forward under body weight (nutation); tenderness here is a clinical sign of sacroiliac joint dysfunction.',
 facts:['Divided into short (deep) and long (superficial) posterior sacroiliac ligaments','Long posterior sacroiliac ligament blends with the sacrotuberous ligament','Much stronger than the anterior sacroiliac ligament'],
 ligAttachments:['Posterior superior iliac spine and iliac tuberosity to the posterior sacrum'],
 ligFunction:'Resists forward tilting (nutation) of the sacrum and stabilizes the posterior sacroiliac joint'},

{id:'w2-sacrotuberous-ligament',name:'Sacrotuberous Ligament',category:'Ligament',week:2,region:'Pelvis',wiki:'Sacrotuberous ligament',
 description:'Strong flat band running from the posterior ilium/sacrum/coccyx to the ischial tuberosity, converting the sciatic notches into foramina.',
 clinical:'Provides a palpable landmark during pudendal nerve blocks; can be a source of proximal hamstring/pelvic pain.',
 facts:['Together with the sacrospinous ligament, converts the greater and lesser sciatic notches into foramina','Continuous with the biceps femoris tendon in many individuals','Resists forward tilting (nutation) of the sacrum'],
 ligAttachments:['Posterior iliac spines, lateral sacrum and coccyx to the ischial tuberosity'],
 ligFunction:'Stabilizes the sacroiliac joint against nutation and helps form the greater/lesser sciatic foramina'},

{id:'w2-sacrospinous-ligament',name:'Sacrospinous Ligament',category:'Ligament',week:2,region:'Pelvis',wiki:'Sacrospinous ligament',
 description:'Triangular ligament running from the lateral sacrum/coccyx to the ischial spine, lying deep/anterior to the sacrotuberous ligament.',
 clinical:'Divides the greater and lesser sciatic foramina, both transmitting important neurovascular structures; used as an anchor point in sacrospinous ligament fixation surgery for pelvic organ prolapse.',
 facts:['Separates the greater sciatic foramen (above) from the lesser sciatic foramen (below)','Pudendal nerve and internal pudendal vessels hook around its ischial spine attachment','Key landmark in pelvic surgical anatomy'],
 ligAttachments:['Lateral sacrum and coccyx to the ischial spine'],
 ligFunction:'Stabilizes the sacroiliac joint and helps define the greater and lesser sciatic foramina'},

{id:'w2-lumbosacral-ligament',name:'Lumbosacral Ligament',category:'Ligament',week:2,region:'Lumbosacral junction',wiki:'Lumbosacral ligament',
 description:'Broad band of fibers connecting the transverse process of L5 to the ala of the sacrum and ilium, often considered continuous with the iliolumbar ligament.',
 clinical:'Reinforces the lumbosacral joint against the considerable shear forces at the L5-S1 transition; laxity is implicated in degenerative spondylolisthesis at this level.',
 facts:['Closely related to and sometimes described as part of the iliolumbar ligament complex','Helps stabilize L5 against anterior shear on the sacrum','Blends with the anterior sacroiliac ligament laterally'],
 ligAttachments:['Transverse process of L5 to the ala of the sacrum'],
 ligFunction:'Reinforces the lumbosacral joint against shear and excessive movement'},
{id:'w2-quadratus-lumborum',name:'Quadratus Lumborum',category:'Muscle',week:2,region:'Posterior abdominal wall',wiki:'Quadratus lumborum muscle',
 description:'Quadrilateral posterior abdominal wall muscle running from the iliac crest/iliolumbar ligament to the twelfth rib and upper lumbar transverse processes.',
 clinical:'A key muscle assessed in flank pain and psoas sign differentials; targeted by QL nerve blocks for abdominal surgery analgesia.',
 facts:['Forms part of the posterior abdominal wall, posterior to the kidney','Fixes rib 12 during deep inspiration and forced expiration (e.g. coughing)','Bilateral contraction extends the lumbar spine; unilateral contraction laterally flexes it'],
 origin:['Posterior iliac crest','Iliolumbar ligament'],
 insertion:['Inferior border of rib 12','Transverse processes of L1-L4'],
 action:['Ipsilateral lateral flexion of the vertebral column','Bilateral: extends the lumbar spine','Fixes rib 12 during inspiration and forced expiration'],
 innervation:'Ventral rami of T12-L4 (subcostal nerve and lumbar plexus branches)', bloodSupply:'Subcostal, lumbar, and iliolumbar arteries'},

{id:'w2-psoas-major',name:'Psoas Major',category:'Muscle',week:2,region:'Posterior abdominal wall',wiki:'Psoas major muscle',
 description:'Long fusiform muscle running from the lumbar vertebral bodies/transverse processes through the pelvis to the lesser trochanter of the femur, joining iliacus to form iliopsoas.',
 clinical:'Psoas abscess (often from tuberculous spondylitis) tracks along the muscle to present as a groin/thigh mass; a positive psoas sign (pain on hip extension) suggests retrocecal appendicitis irritating the muscle.',
 facts:['Combines with iliacus to form iliopsoas, the primary hip flexor','The lumbar plexus forms within its substance','Crossed anteriorly by the ureter and gonadal vessels'],
 origin:['Transverse processes, bodies, and intervertebral discs of T12-L5'],
 insertion:['Lesser trochanter of the femur (with iliacus, as iliopsoas)'],
 action:['Flexion of the hip joint','Contributes to trunk flexion and lumbar spine stabilization'],
 innervation:'Ventral rami of L1-L3 (lumbar plexus)', bloodSupply:'Lumbar arteries, iliolumbar artery'},

{id:'w2-psoas-minor',name:'Psoas Minor',category:'Muscle',week:2,region:'Posterior abdominal wall',wiki:'Psoas minor muscle',
 description:'Small, long-tendoned muscle anterior to psoas major, present in only about 50% of people.',
 clinical:'Clinically insignificant in isolation but a common anatomical variant, important when unexpectedly present or absent on imaging/dissection.',
 facts:['Absent unilaterally or bilaterally in a substantial proportion of people','Has a very long tendon and short muscle belly','Weak flexor of the lumbar spine, with no action on the hip'],
 origin:['Bodies of T12 and L1 vertebrae'],
 insertion:['Pectineal line and iliopubic eminence via the iliac fascia'],
 action:['Weak flexion of the lumbar vertebral column'],
 innervation:'Ventral ramus of L1', bloodSupply:'Lumbar arteries'},

{id:'w2-iliacus',name:'Iliacus',category:'Muscle',week:2,region:'Posterior abdominal wall/pelvis',wiki:'Iliacus muscle',
 description:'Fan-shaped muscle filling the iliac fossa, joining the tendon of psoas major to form iliopsoas before inserting on the lesser trochanter.',
 clinical:'The femoral nerve, which supplies iliacus, runs in the groove between iliacus and psoas major, relevant to femoral nerve blocks and injuries.',
 facts:['Fills the concave iliac fossa of the pelvis','Unlike psoas major (lumbar plexus), innervated directly by the femoral nerve','Joins psoas major to form iliopsoas, the strongest hip flexor'],
 origin:['Iliac fossa','Ala of the sacrum','Anterior sacroiliac ligaments'],
 insertion:['Lesser trochanter of the femur (with psoas major, as iliopsoas)'],
 action:['Flexion of the hip joint'],
 innervation:'Femoral nerve (L2-L4)', bloodSupply:'Iliolumbar artery'},

{id:'w2-iliocostalis-lumborum',name:'Iliocostalis Lumborum',category:'Muscle',week:2,region:'Erector spinae, lumbar part',wiki:'Iliocostalis',
 description:'Lumbar portion of iliocostalis, the most lateral erector spinae column, running from the sacrum/iliac crest to the angles of the lower ribs.',
 clinical:'A common site of acute mechanical low back strain ("lumbar strain") after lifting injuries, given its role as a primary lumbar extensor.',
 facts:['Most lateral of the erector spinae columns in the lumbar region','Blends with the aponeurosis of the thoracolumbar fascia at its origin','Works with longissimus and multifidus as primary lumbar extensors'],
 origin:['Sacrum','Iliac crest','Thoracolumbar fascia'],
 insertion:['Angles of the lower 6 ribs'],
 action:['Bilateral: extension of the lumbar spine','Unilateral: ipsilateral lateral flexion'],
 innervation:'Dorsal rami of lumbar spinal nerves', bloodSupply:'Lumbar arteries'},

{id:'w2-longissimus-thoracis',name:'Longissimus Thoracis (Lumbar Part)',category:'Muscle',week:2,region:'Erector spinae, lumbar part',wiki:'Longissimus',
 description:'Lumbar/thoracic portion of longissimus, the intermediate erector spinae column, with a substantial lumbar origin from the sacrum and lumbar transverse processes.',
 clinical:'Along with iliocostalis, forms the bulk of the palpable paraspinal muscle mass in the lumbar region assessed in back examinations.',
 facts:['Has both a medial tendinous part attaching to lumbar accessory/mammillary processes and a lateral muscular part','Intermediate column between iliocostalis (lateral) and spinalis (medial)','Major extensor of the lumbar and thoracic spine'],
 origin:['Sacrum','Iliac crest','Lumbar and lower thoracic transverse processes'],
 insertion:['Transverse processes of upper lumbar/thoracic vertebrae','Ribs'],
 action:['Bilateral: extension of the vertebral column','Unilateral: lateral flexion'],
 innervation:'Dorsal rami of spinal nerves', bloodSupply:'Lumbar and posterior intercostal arteries'},

{id:'w2-external-oblique',name:'External Oblique',category:'Muscle',week:2,region:'Anterolateral abdominal wall',wiki:'External oblique muscle',
 description:'Largest and most superficial of the anterolateral abdominal wall muscles, fibers running inferomedially ("hands in pockets") from the lower ribs to the iliac crest, pubic tubercle, and linea alba.',
 clinical:'Its aponeurosis forms the inguinal ligament and the superficial inguinal ring, both critical landmarks in inguinal hernia repair.',
 facts:['Fibers run in the same direction as external intercostals','Aponeurosis forms the anterior wall of the rectus sheath and the inguinal ligament','Forms the superficial inguinal ring at its medial attachment'],
 origin:['External surfaces of ribs 5-12'],
 insertion:['Iliac crest','Pubic tubercle','Linea alba (via aponeurosis)'],
 action:['Bilateral: flexes the trunk and compresses abdominal contents','Unilateral: contralateral trunk rotation and ipsilateral lateral flexion'],
 innervation:'Thoracoabdominal nerves (T7-T11), subcostal nerve (T12)', bloodSupply:'Lower posterior intercostal and subcostal arteries, deep circumflex iliac artery'},

{id:'w2-internal-oblique',name:'Internal Oblique',category:'Muscle',week:2,region:'Anterolateral abdominal wall',wiki:'Internal oblique muscle',
 description:'Middle layer of the anterolateral abdominal wall, deep to external oblique, fibers running perpendicular (superomedially) to it.',
 clinical:'Its lowest fibers, together with transversus abdominis, form the conjoint tendon which reinforces the posterior wall of the inguinal canal, key in hernia repair.',
 facts:['Fibers run perpendicular to external oblique, parallel to internal intercostals','Lowest fibers form the cremaster muscle in males','Aponeurosis splits to form both anterior and posterior layers of the rectus sheath above the arcuate line'],
 origin:['Thoracolumbar fascia','Iliac crest','Lateral inguinal ligament'],
 insertion:['Ribs 10-12','Linea alba','Pubic crest (via conjoint tendon)'],
 action:['Bilateral: compresses abdominal contents, flexes trunk','Unilateral: ipsilateral trunk rotation and lateral flexion'],
 innervation:'Thoracoabdominal nerves (T7-T11), subcostal nerve (T12), iliohypogastric and ilioinguinal nerves (L1)', bloodSupply:'Lower posterior intercostal, subcostal, and lumbar arteries'},

{id:'w2-transversus-abdominis',name:'Transversus Abdominis',category:'Muscle',week:2,region:'Anterolateral abdominal wall',wiki:'Transversus abdominis muscle',
 description:'Deepest of the three flat anterolateral abdominal wall muscles, fibers running transversely (horizontally) around the trunk.',
 clinical:'Key muscle targeted in the transversus abdominis plane (TAP) block, providing analgesia for abdominal wall incisions.',
 facts:['Deepest of the three flat abdominal muscles, deep to internal oblique','Fibers run horizontally, providing a "corset" effect compressing abdominal viscera','Contributes to the conjoint tendon and posterior rectus sheath'],
 origin:['Thoracolumbar fascia','Iliac crest','Inguinal ligament','Costal cartilages 7-12'],
 insertion:['Linea alba','Pubic crest (via conjoint tendon)'],
 action:['Compresses the abdominal contents (increases intra-abdominal pressure), supports the abdominal viscera'],
 innervation:'Thoracoabdominal nerves (T7-T11), subcostal nerve (T12), iliohypogastric and ilioinguinal nerves (L1)', bloodSupply:'Lower posterior intercostal, subcostal, and lumbar arteries'},

{id:'w2-rectus-abdominis',name:'Rectus Abdominis',category:'Muscle',week:2,region:'Anterior abdominal wall',wiki:'Rectus abdominis muscle',
 description:'Paired long vertical muscle running from the pubic crest to the costal cartilages of ribs 5-7, enclosed within the rectus sheath and interrupted by tendinous intersections.',
 clinical:'Diastasis recti (midline separation at the linea alba) is common in pregnancy; the tendinous intersections firmly adhere to the anterior rectus sheath but not the posterior, creating the "six-pack" appearance.',
 facts:['Divided by 3-4 tendinous intersections that adhere to the anterior rectus sheath','Enclosed in the rectus sheath, formed by the aponeuroses of the three flat abdominal muscles','Below the arcuate line, the sheath is deficient posteriorly, leaving only transversalis fascia behind the muscle'],
 origin:['Pubic crest and pubic symphysis'],
 insertion:['Costal cartilages of ribs 5-7','Xiphoid process'],
 action:['Flexes the trunk (lumbar spine), compresses abdominal viscera, stabilizes the pelvis'],
 innervation:'Thoracoabdominal nerves (T7-T11) and subcostal nerve (T12)', bloodSupply:'Superior and inferior epigastric arteries'},

{id:'w2-diaphragmatic-crura',name:'Diaphragmatic Crura',category:'Muscle',week:2,region:'Posterior abdominal wall',wiki:'Thoracic diaphragm',
 description:'Paired tendinous bundles (right and left crus) anchoring the diaphragm to the upper lumbar vertebral bodies, with the right crus longer than the left.',
 clinical:'The right crus fibers decussate around the esophagus and contribute to the lower esophageal sphincter mechanism; laxity contributes to hiatus hernia and GERD.',
 facts:['Right crus arises from L1-L3, left crus from L1-L2','Medial and lateral arcuate ligaments arch over psoas major and quadratus lumborum respectively, giving them additional diaphragmatic origin','Crura cross anterior to the aorta, contributing to the aortic hiatus at T12'],
 origin:['Right crus: bodies of L1-L3','Left crus: bodies of L1-L2'],
 insertion:['Central tendon of the diaphragm'],
 action:['Contract with the rest of the diaphragm to increase thoracic volume during inspiration; right crus fibers assist closure of the esophageal hiatus'],
 innervation:'Phrenic nerve (C3-C5)', bloodSupply:'Inferior phrenic arteries'},

{id:'w2-thoracolumbar-fascia',name:'Thoracolumbar Fascia',category:'Fascia',week:2,region:'Posterior trunk',wiki:'Thoracolumbar fascia',
 description:'Strong fibrous sheath in the lumbar region composed of anterior, middle, and posterior layers that envelop the deep back muscles (erector spinae) and quadratus lumborum.',
 clinical:'A major contributor to core stability and a common site of pain/strain in mechanical low back pain; engaged in "hoop stress" load transfer between the upper and lower body during lifting.',
 facts:['Posterior layer gives origin to latissimus dorsi','Middle layer separates erector spinae from quadratus lumborum','Anterior layer covers the anterior surface of quadratus lumborum and is continuous with the psoas fascia']},

{id:'w2-rectus-sheath',name:'Rectus Sheath',category:'Fascia',week:2,region:'Anterior abdominal wall',wiki:'Rectus sheath',
 description:'Aponeurotic sheath enclosing rectus abdominis, formed by the split and fused aponeuroses of the external oblique, internal oblique, and transversus abdominis.',
 clinical:'Below the arcuate line, the posterior wall is deficient, so hematomas or hernias behave differently above vs below the line — an important clinical distinction.',
 facts:['Above the arcuate line: anterior wall = external oblique + half of internal oblique aponeurosis; posterior wall = half of internal oblique + transversus abdominis aponeurosis','Below the arcuate line: all three aponeuroses pass anterior to rectus abdominis, leaving only transversalis fascia posteriorly','Linea alba is formed by the midline fusion of the sheaths from both sides']},

{id:'w2-transversalis-fascia',name:'Transversalis Fascia',category:'Fascia',week:2,region:'Anterior abdominal wall (deep)',wiki:'Transversalis fascia',
 description:'Thin fascial layer lining the deep surface of transversus abdominis, part of the continuous endoabdominal fascia lining the entire abdominal cavity.',
 clinical:'Forms the deep inguinal ring and is a key layer repaired/reinforced in inguinal hernia surgery (e.g. mesh placement in TEP/TAPP laparoscopic repair).',
 facts:['Continuous with the iliac fascia, pelvic fascia, and diaphragmatic fascia as part of the general endoabdominal fascia','Forms the deep inguinal ring at the midpoint of the inguinal ligament','Lies between transversus abdominis and the parietal peritoneum']},
{id:'w2-lumbar-plexus',name:'Lumbar Plexus',category:'Nerve',week:2,region:'Posterior abdominal wall, within psoas major',wiki:'Lumbar plexus',
 description:'Network formed by the ventral rami of L1-L4 (with a small T12 contribution) within the substance of psoas major, giving rise to the major nerves of the anterior/medial thigh and lower abdominal wall.',
 clinical:'Can be anesthetized as a unit via a posterior lumbar plexus (psoas compartment) block, providing analgesia for hip and knee surgery.',
 facts:['Forms within psoas major, unlike the brachial plexus which forms in a fascial space between muscles','Major branches include the femoral, obturator, and lateral femoral cutaneous nerves','L4 also contributes to the lumbosacral trunk, linking it to the sacral plexus'],
 roots:'Ventral rami of T12 (small contribution) and L1-L4',
 course:'Forms within the substance of psoas major on the posterior abdominal wall',
 motorSupply:'Anterior and medial thigh muscles (via femoral and obturator nerves), lower abdominal wall muscles (via iliohypogastric/ilioinguinal)',
 sensorySupply:'Anterior/medial thigh, anterior leg, groin, and lower abdomen',
 branches:['Iliohypogastric nerve','Ilioinguinal nerve','Genitofemoral nerve','Lateral femoral cutaneous nerve','Obturator nerve','Femoral nerve','Lumbosacral trunk']},

{id:'w2-iliohypogastric-nerve',name:'Iliohypogastric Nerve',category:'Nerve',week:2,region:'Posterior/anterior abdominal wall',wiki:'Iliohypogastric nerve',
 description:'Branch of the lumbar plexus that emerges from the lateral border of psoas major and runs anteriorly to supply the lower abdominal wall and skin above the pubis.',
 clinical:'Vulnerable to injury during appendectomy (Pfannenstiel/McBurney incisions) or hernia repair, causing sensory loss and weakness contributing to a bulge resembling a hernia.',
 facts:['Runs a course roughly parallel to and just above the ilioinguinal nerve','Terminates as a cutaneous branch supplying skin above the pubis','Often injured together with the ilioinguinal nerve in lower abdominal surgery'],
 roots:'L1 (sometimes with a T12 contribution)',
 course:'Emerges from the lateral border of psoas major, crosses quadratus lumborum, pierces transversus abdominis near the iliac crest, then runs between internal oblique and transversus abdominis',
 motorSupply:'Internal oblique and transversus abdominis (lower fibers)',
 sensorySupply:'Skin over the suprapubic region and posterolateral gluteal skin',
 branches:['Lateral cutaneous branch','Anterior cutaneous branch']},

{id:'w2-ilioinguinal-nerve',name:'Ilioinguinal Nerve',category:'Nerve',week:2,region:'Inguinal region',wiki:'Ilioinguinal nerve',
 description:'Branch of the lumbar plexus running below the iliohypogastric nerve, passing through the inguinal canal to supply the skin of the upper medial thigh and genitalia.',
 clinical:'Commonly injured or entrapped during inguinal hernia repair, causing chronic groin pain (ilioinguinal neuralgia).',
 facts:['Smaller than the iliohypogastric nerve, with a lower, more parallel course','Enters the inguinal canal through the superficial inguinal ring, not the deep ring','Supplies sensation to the root of the penis/anterior scrotum (males) or mons pubis/labia majora (females)'],
 roots:'L1',
 course:'Emerges from the lateral border of psoas major below the iliohypogastric nerve, pierces internal oblique, and travels through the inguinal canal to exit via the superficial inguinal ring',
 motorSupply:'Internal oblique and transversus abdominis (small contribution)',
 sensorySupply:'Skin of the upper medial thigh, root of the penis/anterior scrotum, or mons pubis/labia majora',
 branches:['No major named branches beyond terminal cutaneous fibers']},

{id:'w2-genitofemoral-nerve',name:'Genitofemoral Nerve',category:'Nerve',week:2,region:'Posterior abdominal wall',wiki:'Genitofemoral nerve',
 description:'Branch of the lumbar plexus that pierces psoas major and runs on its anterior surface before dividing into genital and femoral branches.',
 clinical:'The genital branch mediates the cremasteric reflex (stroking the medial thigh causes testicular elevation), a useful clinical test of L1-L2 spinal cord integrity.',
 facts:['Uniquely pierces through the substance of psoas major rather than emerging from its border','Genital branch runs through the inguinal canal to supply the cremaster muscle and scrotal/labial skin','Femoral branch supplies skin over the femoral triangle'],
 roots:'L1-L2',
 course:'Pierces psoas major and descends on its anterior surface, dividing into genital and femoral branches near the inguinal ligament',
 motorSupply:'Cremaster muscle (genital branch, in males)',
 sensorySupply:'Anterior scrotum/labia majora (genital branch), skin of the femoral triangle (femoral branch)',
 branches:['Genital branch','Femoral branch']},

{id:'w2-lateral-femoral-cutaneous',name:'Lateral Femoral Cutaneous Nerve',category:'Nerve',week:2,region:'Pelvis/thigh',wiki:'Lateral cutaneous nerve of thigh',
 description:'Purely sensory branch of the lumbar plexus that crosses iliacus and passes deep or through the inguinal ligament near the anterior superior iliac spine to supply the lateral thigh.',
 clinical:'Entrapment at the inguinal ligament causes meralgia paresthetica, presenting with burning pain/numbness over the anterolateral thigh, associated with obesity, pregnancy, or tight belts/clothing.',
 facts:['Purely sensory — no motor function','Passes close to the anterior superior iliac spine, at risk during iliac crest bone graft harvest or hip surgery','Variable course through or under the inguinal ligament predisposes it to entrapment'],
 roots:'L2-L3',
 course:'Crosses iliacus obliquely, passes under or through the inguinal ligament just medial to the ASIS, and descends into the thigh',
 motorSupply:'None (purely sensory)',
 sensorySupply:'Skin of the anterolateral thigh down to the knee',
 branches:['Anterior branch','Posterior branch']},

{id:'w2-obturator-nerve',name:'Obturator Nerve',category:'Nerve',week:2,region:'Pelvis/medial thigh',wiki:'Obturator nerve',
 description:'Branch of the lumbar plexus that descends through psoas major and pelvis to exit through the obturator foramen, supplying the medial thigh adductors.',
 clinical:'Can be injured during pelvic surgery (e.g. laparoscopic lymphadenectomy) or compressed by obturator hernia; obturator sign (pain on internal rotation of the flexed hip) suggests pelvic inflammation irritating the nerve.',
 facts:['Emerges from the medial border of psoas major, unlike the femoral nerve (lateral border)','Passes through the obturator foramen with the obturator vessels','Divides into anterior and posterior branches around obturator externus'],
 roots:'L2-L4',
 course:'Descends within psoas major, emerges from its medial border, crosses the pelvic brim, and exits the pelvis via the obturator canal',
 motorSupply:'Adductor muscles of the thigh (adductor longus, brevis, magnus, gracilis, obturator externus)',
 sensorySupply:'Small area of skin on the medial thigh',
 branches:['Anterior branch','Posterior branch']},

{id:'w2-femoral-nerve',name:'Femoral Nerve',category:'Nerve',week:2,region:'Posterior abdominal wall/thigh',wiki:'Femoral nerve',
 description:'Largest branch of the lumbar plexus, descending in the groove between psoas major and iliacus to enter the thigh lateral to the femoral artery beneath the inguinal ligament.',
 clinical:'Femoral nerve palsy causes weakness of knee extension and loss of the patellar reflex and sensation over the anterior/medial thigh and leg; a key landmark nerve in femoral nerve blocks.',
 facts:['Largest branch of the lumbar plexus','Lies lateral to the femoral artery and vein in the femoral triangle (mnemonic NAVEL, lateral to medial)','Terminal cutaneous branch, the saphenous nerve, supplies the medial leg down to the foot'],
 roots:'L2-L4',
 course:'Descends between psoas major and iliacus, passes beneath the inguinal ligament lateral to the femoral vessels to enter the femoral triangle',
 motorSupply:'Anterior thigh muscles (quadriceps femoris, sartorius, pectineus)',
 sensorySupply:'Anterior thigh, and via the saphenous nerve, the medial leg and foot',
 branches:['Anterior cutaneous branches','Muscular branches to quadriceps/sartorius/pectineus','Saphenous nerve']},

{id:'w2-lumbosacral-trunk',name:'Lumbosacral Trunk',category:'Nerve',week:2,region:'Pelvic brim',wiki:'Lumbosacral trunk',
 description:'Nerve formed by the union of part of the L4 ventral ramus with the L5 ventral ramus, descending over the sacral ala to join the sacral plexus.',
 clinical:'Vulnerable to compression during pregnancy/labor (by the fetal head) or pelvic surgery, contributing to lumbosacral plexopathy with mixed L4-S1 deficits.',
 facts:['Physically links the lumbar plexus to the sacral plexus','Crosses the pelvic brim just anterior to the sacroiliac joint','Contributes fibers to the sciatic nerve via the sacral plexus'],
 roots:'L4 (partial) and L5',
 course:'Descends over the ala of the sacrum and pelvic brim to join the ventral rami of S1-S3 forming the sacral plexus',
 motorSupply:'Contributes to sacral plexus branches supplying the posterior thigh, leg, and foot (via the sciatic nerve)',
 sensorySupply:'Contributes to sacral plexus cutaneous branches',
 branches:['Joins directly with the sacral plexus — no independent named branches']},

{id:'w2-subcostal-nerve',name:'Subcostal Nerve',category:'Nerve',week:2,region:'Posterior/anterior abdominal wall',wiki:'Subcostal nerve',
 description:'Anterior ramus of T12, running below the twelfth rib along the posterior abdominal wall to supply the lower abdominal wall and hip region.',
 clinical:'Can be injured during flank incisions (e.g. nephrectomy) or entrapped by quadratus lumborum, causing lower abdominal wall pain that can mimic visceral pathology.',
 facts:['Largest of the thoracoabdominal-type nerves, analogous to an intercostal nerve but below rib 12','Crosses anterior to quadratus lumborum and pierces transversus abdominis','Contributes fibers to the lumbar plexus in some individuals'],
 roots:'Anterior (ventral) ramus of T12',
 course:'Runs along the inferior border of rib 12, crosses quadratus lumborum, and continues into the abdominal wall between internal oblique and transversus abdominis',
 motorSupply:'Lower fibers of the abdominal wall muscles (external/internal oblique, transversus abdominis, pyramidalis)',
 sensorySupply:'Skin of the lower abdominal wall and hip',
 branches:['Lateral cutaneous branch','Anterior cutaneous branch']},

{id:'w2-abdominal-aorta',name:'Abdominal Aorta',category:'Artery',week:2,region:'Retroperitoneum',wiki:'Abdominal aorta',
 description:'Continuation of the thoracic aorta below the diaphragm (from T12) to its bifurcation into the common iliac arteries at L4, giving off the major visceral and parietal branches of the abdomen.',
 clinical:'The most common site of abdominal aortic aneurysm, particularly infrarenal, which can rupture catastrophically; assessed for bruits/pulsatile mass on exam.',
 facts:['Bifurcates into the common iliac arteries at L4, just left of the midline','Gives off three unpaired anterior visceral branches (celiac trunk, SMA, IMA) and paired lateral branches (renal, gonadal, suprarenal)','Lumbar arteries arise segmentally from its posterior surface'],
 arteryOrigin:'Continuation of the thoracic aorta through the aortic hiatus of the diaphragm (T12)',
 arteryBranches:['Celiac trunk','Superior mesenteric artery','Inferior mesenteric artery','Renal arteries','Gonadal arteries','Middle suprarenal arteries','Lumbar arteries','Median sacral artery','Common iliac arteries'],
 areasSupplied:'All abdominal and pelvic viscera and the lower limbs (via its terminal branches)'},

{id:'w2-common-iliac-artery',name:'Common Iliac Artery',category:'Artery',week:2,region:'Pelvis',wiki:'Common iliac artery',
 description:'Terminal branches of the abdominal aorta, formed at its bifurcation at L4, each dividing into internal and external iliac arteries at the sacroiliac joint.',
 clinical:'A common site for atherosclerotic disease and aneurysm, and an important vessel for surgical access/stenting in aortoiliac occlusive disease.',
 facts:['Right common iliac artery crosses anterior to the left common iliac vein, a point of potential venous compression','Bifurcates into internal and external iliac arteries anterior to the sacroiliac joint','Has no branches before its bifurcation'],
 arteryOrigin:'Bifurcation of the abdominal aorta at L4', arteryBranches:['Internal iliac artery','External iliac artery (terminal branches only)'], areasSupplied:'Pelvic viscera (via internal iliac) and lower limb (via external iliac)'},

{id:'w2-lumbar-arteries',name:'Lumbar Arteries',category:'Artery',week:2,region:'Posterior abdominal wall',wiki:'Lumbar arteries',
 description:'Four (occasionally five) paired segmental arteries arising from the posterior surface of the abdominal aorta at each lumbar vertebral level.',
 clinical:'A source of significant retroperitoneal bleeding if injured during spinal or retroperitoneal surgery; analogous in course to the posterior intercostal arteries of the thorax.',
 facts:['Segmental branches analogous to posterior intercostal arteries','Pass posteriorly around the vertebral bodies, deep to the sympathetic trunk and psoas major','Supply the posterior abdominal wall, vertebral column, and spinal cord (via spinal branches)'],
 arteryOrigin:'Posterior aspect of the abdominal aorta, at each of the L1-L4 vertebral levels', arteryBranches:['Dorsal branch','Spinal branch','Muscular branches'], areasSupplied:'Posterior abdominal wall muscles, vertebral column, spinal cord and meninges'},

{id:'w2-median-sacral-artery',name:'Median Sacral Artery',category:'Artery',week:2,region:'Pelvis',wiki:'Median sacral artery',
 description:'Small unpaired artery arising from the posterior aspect of the aortic bifurcation, descending in the midline over the sacrum to the coccyx.',
 clinical:'Represents the vestigial continuation of the embryonic dorsal aorta; can be a minor source of bleeding during sacral/coccygeal surgery.',
 facts:['Arises just above the aortic bifurcation, from the posterior wall','Anastomoses with the lateral sacral arteries','Analogous to the continuation of the primitive dorsal aorta in the embryo'],
 arteryOrigin:'Posterior aspect of the abdominal aorta, just proximal to its bifurcation', arteryBranches:['Small lumbar and sacral branches'], areasSupplied:'Posterior rectum, sacrum, and coccyx'},

{id:'w2-common-iliac-vein',name:'Common Iliac Vein',category:'Vein',week:2,region:'Pelvis',wiki:'Common iliac vein',
 description:'Vein formed by the union of the internal and external iliac veins, which then unites with its contralateral partner to form the inferior vena cava.',
 clinical:'The left common iliac vein is compressed by the overlying right common iliac artery, predisposing to left-sided deep vein thrombosis (May-Thurner syndrome).',
 facts:['Left common iliac vein is longer and crosses more obliquely than the right, passing beneath the right common iliac artery','Union of the two common iliac veins forms the IVC at approximately L5','Lacks valves, like the rest of the IVC system'],
 veinDrainage:'Pelvis and lower limb (via internal and external iliac veins)', veinTributaries:['Internal iliac vein','External iliac vein','Iliolumbar vein'], veinTermination:'Unites with the contralateral common iliac vein to form the inferior vena cava'},

{id:'w2-ascending-lumbar-vein',name:'Ascending Lumbar Vein',category:'Vein',week:2,region:'Posterior abdominal wall',wiki:'Ascending lumbar vein',
 description:'Longitudinal venous channel connecting the lumbar veins vertically, lying anterior to the transverse processes and continuing superiorly as the azygos vein (right) or hemiazygos vein (left).',
 clinical:'Forms an important collateral pathway between the IVC and SVC systems when the IVC is obstructed.',
 facts:['Connects segmental lumbar veins that otherwise drain directly into the IVC','Right ascending lumbar vein becomes the azygos vein above the diaphragm','Left ascending lumbar vein becomes the hemiazygos vein'],
 veinDrainage:'Lumbar veins of the posterior abdominal wall', veinTributaries:['Lumbar veins','Iliolumbar vein'], veinTermination:'Continues as the azygos vein (right) or hemiazygos vein (left) above the diaphragm'},

{id:'w2-gonadal-artery',name:'Gonadal Artery (Testicular/Ovarian)',category:'Artery',week:2,region:'Retroperitoneum',wiki:'Gonadal artery',
 description:'Paired slender arteries arising from the anterior abdominal aorta just below the renal arteries, descending retroperitoneally to supply the testis (via the inguinal canal) or ovary.',
 clinical:'The right gonadal vessels cross anterior to the IVC and are at risk during retroperitoneal lymph node dissection; testicular artery injury/torsion compromises testicular viability given its limited collateral supply.',
 facts:['Testicular artery travels the full length of the inguinal canal within the spermatic cord','Ovarian artery instead enters the pelvis via the suspensory ligament of the ovary','Long course reflects the embryological descent of the gonads from a high abdominal origin'],
 arteryOrigin:'Anterior surface of the abdominal aorta, just inferior to the renal arteries', arteryBranches:['Terminal branches supplying the testis/epididymis or ovary'], areasSupplied:'Testis and epididymis (testicular artery) or ovary and part of the uterine tube (ovarian artery)'},

{id:'w2-gonadal-vein',name:'Gonadal Vein (Testicular/Ovarian)',category:'Vein',week:2,region:'Retroperitoneum',wiki:'Gonadal vein',
 description:'Paired veins draining the testis or ovary, with asymmetric termination — the right draining directly into the IVC and the left into the left renal vein.',
 clinical:'The left testicular vein\'s near-right-angle entry into the left renal vein predisposes to left-sided varicocele; a new right-sided varicocele raises concern for IVC obstruction (e.g. renal cell carcinoma with tumor thrombus).',
 facts:['Right gonadal vein drains directly and obliquely into the IVC','Left gonadal vein drains into the left renal vein at a right angle, a less favorable drainage angle','Forms the pampiniform plexus around the testicular artery in males'],
 veinDrainage:'Testis and epididymis, or ovary', veinTributaries:['Pampiniform plexus (testicular) or ovarian venous plexus'], veinTermination:'Right: inferior vena cava directly; Left: left renal vein'},

{id:'w2-lumbar-lymph-nodes',name:'Lumbar Lymph Nodes',category:'Lymph',week:2,region:'Retroperitoneum',wiki:'Lumbar lymph nodes',
 description:'Chain of lymph nodes along the abdominal aorta and IVC (para-aortic/paracaval nodes) receiving drainage from the posterior abdominal wall, kidneys, gonads, and pelvis.',
 clinical:'A common site of metastasis from testicular and ovarian cancer (reflecting the embryological origin of the gonads) and a key area assessed in retroperitoneal lymph node dissection and staging imaging.',
 facts:['Receive direct lymphatic drainage from the testes/ovaries, reflecting their embryological origin high on the posterior abdominal wall','Efferents form the lumbar lymphatic trunks','Also drain the kidneys, adrenal glands, and posterior abdominal wall']},

{id:'w2-lumbar-lymphatic-trunk',name:'Lumbar Lymphatic Trunk',category:'Lymph',week:2,region:'Retroperitoneum',wiki:'Lumbar lymphatic trunk',
 description:'Paired lymphatic trunks formed by the convergence of efferent vessels from the lumbar (para-aortic) lymph nodes, draining into the cisterna chyli.',
 clinical:'Obstruction or injury (e.g. during aortic aneurysm repair) can result in chylous ascites due to leakage of chyle-rich lymph into the peritoneal cavity.',
 facts:['Drains the lower limbs, pelvis, and abdominal wall/viscera drained by the lumbar nodes','Joins the intestinal lymphatic trunk to form the cisterna chyli','Right and left trunks run alongside the corresponding common iliac vessels before ascending']},
/*WEEK2_END*/
/*WEEK3_START*/
{id:'w3-right-atrium',name:'Right Atrium',category:'Organ',week:3,region:'Heart',wiki:'Atrium (heart)',
 description:'Thin-walled chamber receiving deoxygenated blood from the SVC, IVC, and coronary sinus, pumping it through the tricuspid valve into the right ventricle.',
 clinical:'Central venous catheters and pacemaker leads are typically positioned in or near the right atrium; atrial septal defects (patent foramen ovale) occur at the fossa ovalis on its septal wall.',
 facts:['Contains the sinoatrial node in its wall near the SVC opening — the heart\'s natural pacemaker','Fossa ovalis marks the remnant of the fetal foramen ovale','Smooth posterior wall (sinus venarum) contrasts with the ridged anterior wall (pectinate muscles) of the auricle']},

{id:'w3-left-atrium',name:'Left Atrium',category:'Organ',week:3,region:'Heart',wiki:'Atrium (heart)',
 description:'Thin-walled chamber forming most of the base (posterior surface) of the heart, receiving oxygenated blood from the four pulmonary veins and pumping it through the mitral valve into the left ventricle.',
 clinical:'Atrial fibrillation predisposes to thrombus formation in the left atrial appendage, a major source of embolic stroke.',
 facts:['Receives four pulmonary veins, typically two from each lung','Forms most of the heart\'s base, related posteriorly to the esophagus','Left atrial appendage is a common site of thrombus formation in atrial fibrillation']},

{id:'w3-right-ventricle',name:'Right Ventricle',category:'Organ',week:3,region:'Heart',wiki:'Ventricle (heart)',
 description:'Crescent-shaped, thin-walled chamber forming most of the anterior surface of the heart, pumping deoxygenated blood through the pulmonary valve into the pulmonary trunk.',
 clinical:'Pumps against the low-resistance pulmonary circuit, so its wall is much thinner than the left ventricle; right ventricular failure causes systemic venous congestion (peripheral edema, hepatomegaly).',
 facts:['Contains the trabeculae carneae and the moderator band, which carries part of the right bundle branch','Forms most of the anterior (sternocostal) surface of the heart','Wall thickness is roughly one-third that of the left ventricle, reflecting lower pulmonary vascular resistance']},

{id:'w3-left-ventricle',name:'Left Ventricle',category:'Organ',week:3,region:'Heart',wiki:'Ventricle (heart)',
 description:'Thick-walled, conical chamber forming the apex and most of the left surface of the heart, pumping oxygenated blood through the aortic valve into the systemic circulation.',
 clinical:'Its thick myocardium (to generate systemic pressures) makes it the chamber most often assessed for hypertrophy/ejection fraction on echocardiography; the most common site of myocardial infarction territory (LAD distribution).',
 facts:['Wall is roughly three times thicker than the right ventricle, reflecting the high pressure of the systemic circulation','Forms the apex of the heart, palpable at the 5th intercostal space, midclavicular line','Papillary muscles anchor the mitral valve via chordae tendineae']},

{id:'w3-tricuspid-valve',name:'Tricuspid Valve',category:'Organ',week:3,region:'Heart',wiki:'Tricuspid valve',
 description:'Atrioventricular valve with three cusps (anterior, posterior, septal) separating the right atrium from the right ventricle.',
 clinical:'Tricuspid regurgitation causes a pansystolic murmur heard best at the left lower sternal border, often secondary to right ventricular dilation or infective endocarditis (classically in IV drug users).',
 facts:['Has three leaflets, unlike the bicuspid mitral valve','Anchored by chordae tendineae to papillary muscles of the right ventricle, preventing prolapse into the atrium during systole','Auscultated best at the left lower sternal border (4th-5th intercostal space)']},

{id:'w3-pulmonary-valve',name:'Pulmonary Valve',category:'Organ',week:3,region:'Heart',wiki:'Pulmonary valve',
 description:'Semilunar valve with three cusps at the junction of the right ventricle and the pulmonary trunk, preventing backflow into the right ventricle during diastole.',
 clinical:'Pulmonary stenosis (often congenital, e.g. in tetralogy of Fallot) obstructs right ventricular outflow, causing right ventricular hypertrophy.',
 facts:['Has no chordae tendineae or papillary muscle support, unlike the AV valves','Auscultated best at the left 2nd intercostal space, parasternal','Closure contributes to the second heart sound (S2), slightly after aortic valve closure']},

{id:'w3-mitral-valve',name:'Mitral Valve',category:'Organ',week:3,region:'Heart',wiki:'Mitral valve',
 description:'Bicuspid atrioventricular valve with anterior and posterior leaflets separating the left atrium from the left ventricle.',
 clinical:'Mitral regurgitation (often from myxomatous degeneration or ischemic papillary muscle dysfunction) causes a holosystolic murmur radiating to the axilla, best heard at the apex.',
 facts:['Only valve with two cusps (bicuspid), hence "mitral" (resembling a bishop\'s mitre)','Anterior leaflet is larger and more mobile than the posterior leaflet','Anchored by chordae tendineae from anterolateral and posteromedial papillary muscles']},

{id:'w3-aortic-valve',name:'Aortic Valve',category:'Organ',week:3,region:'Heart',wiki:'Aortic valve',
 description:'Semilunar valve with three cusps (right, left, posterior/non-coronary) at the junction of the left ventricle and the ascending aorta, giving rise to the coronary arteries from its sinuses.',
 clinical:'Aortic stenosis (often calcific in the elderly or from a congenital bicuspid valve) causes a crescendo-decrescendo systolic murmur radiating to the carotids and can lead to left ventricular hypertrophy/syncope.',
 facts:['Coronary arteries arise from the right and left aortic sinuses, just above the valve cusps','A congenitally bicuspid aortic valve (2 cusps instead of 3) is the most common congenital heart valve anomaly','Closure contributes to the second heart sound (S2), auscultated best at the right 2nd intercostal space']},

{id:'w3-epicardium',name:'Epicardium',category:'Fascia',week:3,region:'Heart',wiki:'Epicardium',
 description:'Outermost layer of the heart wall, synonymous with the visceral layer of serous pericardium, directly adherent to the myocardium.',
 clinical:'Coronary vessels and cardiac nerves run within the epicardium before penetrating the myocardium; epicardial fat pads can be a source of confusion on cardiac imaging.',
 facts:['Same tissue as the visceral (inner) layer of serous pericardium','Contains the major coronary vessels before they penetrate the myocardium','Composed of mesothelium overlying connective tissue and fat']},

{id:'w3-myocardium',name:'Myocardium',category:'Organ',week:3,region:'Heart',wiki:'Myocardium',
 description:'Thick middle muscular layer of the heart wall composed of cardiac muscle fibers, responsible for the heart\'s contractile force.',
 clinical:'The tissue that dies in myocardial infarction when its blood supply is interrupted; thickness correlates with the workload of each chamber (thickest in the left ventricle).',
 facts:['Composed of branching cardiac myocytes connected by intercalated discs for synchronized contraction','Thickness varies by chamber — thickest in the left ventricle, thinnest in the atria','Supplied by the coronary arteries, which fill predominantly during diastole']},

{id:'w3-endocardium',name:'Endocardium',category:'Fascia',week:3,region:'Heart',wiki:'Endocardium',
 description:'Thin innermost layer of the heart wall lining the chambers and covering the valves, continuous with the endothelium of the great vessels.',
 clinical:'Site of infection in infective endocarditis, where vegetations of bacteria and fibrin form on damaged endocardium/valves.',
 facts:['Continuous with the vascular endothelium of vessels entering/leaving the heart','Covers the valve leaflets and the chordae tendineae','Site of origin for endocarditis vegetations, most often on the mitral and aortic valves']},

{id:'w3-sa-node',name:'Sinoatrial (SA) Node',category:'Nerve',week:3,region:'Right atrium',wiki:'Sinoatrial node',
 description:'Small cluster of specialized pacemaker cells in the right atrial wall near the opening of the SVC, generating the heart\'s intrinsic rhythm.',
 clinical:'Sick sinus syndrome (SA node dysfunction) causes bradycardia/arrhythmia often requiring pacemaker implantation; the SA node is typically supplied by the right coronary artery (~60% of people).',
 facts:['The heart\'s natural pacemaker, setting the intrinsic rate (~60-100bpm)','Located at the junction of the SVC and right atrium (crista terminalis)','Richly supplied by both sympathetic and parasympathetic (vagal) autonomic fibers, which modulate heart rate'],
 roots:'Not applicable — cardiac conduction tissue, not a peripheral nerve', course:'Impulse spreads from the SA node across the atria to the AV node',
 motorSupply:'Generates the cardiac impulse that triggers atrial and (via the AV node) ventricular contraction', sensorySupply:'Not applicable',
 branches:['Internodal pathways to the AV node']},

{id:'w3-av-node-system',name:'Atrioventricular (AV) Node and Conduction System',category:'Nerve',week:3,region:'Interatrial septum/ventricles',wiki:'Atrioventricular node',
 description:'Specialized conduction tissue at the base of the interatrial septum that delays the impulse from the SA node before relaying it via the bundle of His and Purkinje fibers to the ventricles.',
 clinical:'AV block (delayed or absent conduction through the node) can be a complication of inferior MI (right coronary artery territory) and may require pacing; the bundle of His/Purkinje system can be disrupted in conduction system disease causing bundle branch block.',
 facts:['Introduces a physiological delay (~0.1s) allowing the atria to finish contracting before the ventricles begin','Continues as the bundle of His, which splits into right and left bundle branches, then Purkinje fibers','Typically supplied by the right coronary artery (~80-90% of people, "right-dominant")'],
 roots:'Not applicable — cardiac conduction tissue', course:'AV node → bundle of His → right and left bundle branches → Purkinje fibers throughout the ventricular myocardium',
 motorSupply:'Relays and propagates the cardiac impulse to trigger coordinated ventricular contraction', sensorySupply:'Not applicable',
 branches:['Bundle of His','Right bundle branch','Left bundle branch','Purkinje fibers']},

{id:'w3-right-lung',name:'Right Lung',category:'Organ',week:3,region:'Thoracic cavity',wiki:'Lung',
 description:'Larger of the two lungs, divided into three lobes (superior, middle, inferior) by the oblique and horizontal fissures.',
 clinical:'Aspirated foreign bodies more commonly enter the right main bronchus (wider, shorter, and more vertical) and lodge in the right lung.',
 facts:['Has three lobes, separated by the oblique and horizontal fissures','Shorter and wider than the left lung due to the liver pushing the diaphragm up on the right','Right main bronchus is more vertical, making it the more common site for aspirated foreign bodies']},

{id:'w3-left-lung',name:'Left Lung',category:'Organ',week:3,region:'Thoracic cavity',wiki:'Lung',
 description:'Smaller of the two lungs, divided into only two lobes (superior and inferior) by the oblique fissure, with a cardiac notch accommodating the heart.',
 clinical:'The cardiac notch and lingula (a tongue-like projection of the superior lobe) are important surgical/radiological landmarks near the heart.',
 facts:['Has only two lobes (no middle lobe, unlike the right)','Cardiac notch on its anterior border accommodates the heart, which is left-shifted in the mediastinum','Lingula is the developmental homologue of the right middle lobe']},

{id:'w3-right-sup-lobe',name:'Right Superior Lobe',category:'Organ',week:3,region:'Right lung',wiki:'Lung',
 description:'Uppermost lobe of the right lung, situated above the horizontal fissure.',
 clinical:'Apical segment pathology (e.g. TB reactivation) classically favors the upper lobes due to higher regional ventilation-to-perfusion ratios.',
 facts:['Separated from the middle lobe by the horizontal fissure and from the inferior lobe by the oblique fissure','Contains the apical, posterior, and anterior bronchopulmonary segments','Related to the subclavian vessels arching over its apex']},

{id:'w3-right-middle-lobe',name:'Right Middle Lobe',category:'Organ',week:3,region:'Right lung',wiki:'Lung',
 description:'Smallest lobe of the right lung, wedged between the horizontal and oblique fissures.',
 clinical:'Right middle lobe syndrome (chronic atelectasis/collapse) can occur due to compression of its narrow bronchus by surrounding lymph nodes.',
 facts:['Unique to the right lung — the left lung\'s lingula is its developmental counterpart','Contains the lateral and medial bronchopulmonary segments','Bordered by the horizontal fissure above and oblique fissure below']},

{id:'w3-right-inf-lobe',name:'Right Inferior Lobe',category:'Organ',week:3,region:'Right lung',wiki:'Lung',
 description:'Largest lobe of the right lung, situated below the oblique fissure and resting on the diaphragm.',
 clinical:'Aspiration pneumonia in a supine patient classically affects the superior segment of the lower lobes given gravity-dependent positioning.',
 facts:['Largest of the three right lobes','Contains the superior (apical) segment plus basal segments','Rests directly on the diaphragm, related to the liver below']},

{id:'w3-left-sup-lobe',name:'Left Superior Lobe (with Lingula)',category:'Organ',week:3,region:'Left lung',wiki:'Lung',
 description:'Upper lobe of the left lung, including the lingula, a tongue-shaped projection considered the developmental equivalent of the right middle lobe.',
 clinical:'The lingula can be affected by aspiration or infection analogously to the right middle lobe, given its similar anatomical position.',
 facts:['The lingula is the left lung\'s equivalent of the right middle lobe','Separated from the inferior lobe by the single oblique fissure (no horizontal fissure on the left)','Cardiac notch is found along its anteroinferior border']},

{id:'w3-left-inf-lobe',name:'Left Inferior Lobe',category:'Organ',week:3,region:'Left lung',wiki:'Lung',
 description:'Lower lobe of the left lung, situated below the oblique fissure and resting on the diaphragm above the spleen and stomach.',
 clinical:'Basal segments of this lobe are a common site for aspiration pneumonia and for pleural effusion layering in the costodiaphragmatic recess.',
 facts:['Separated from the superior lobe by the oblique fissure','Contains superior (apical) and basal bronchopulmonary segments','Related inferiorly to the diaphragm, spleen, and stomach fundus']},

{id:'w3-oblique-fissure',name:'Oblique Fissure',category:'Fascia',week:3,region:'Lungs',wiki:'Oblique fissure',
 description:'Deep fissure present in both lungs, running obliquely from the posterior/superior border down to the anteroinferior border, separating the superior (and middle, on the right) lobe from the inferior lobe.',
 clinical:'Surface projection follows roughly the line of the medial border of the scapula in full abduction — used to auscultate/percuss lobar boundaries clinically.',
 facts:['Present in both lungs, unlike the horizontal fissure (right lung only)','Corresponds roughly to the medial scapular border when the arm is fully abducted','Lined by visceral pleura, allowing the lobes limited independent movement']},

{id:'w3-horizontal-fissure',name:'Horizontal Fissure',category:'Fascia',week:3,region:'Right lung',wiki:'Horizontal fissure of right lung',
 description:'Fissure unique to the right lung, running roughly horizontally from the oblique fissure to the anterior border, separating the superior lobe from the middle lobe.',
 clinical:'Absent or incomplete horizontal fissures are a common anatomical variant, relevant to interpreting chest imaging and planning lobectomy.',
 facts:['Present only in the right lung (the left lung has only one, oblique, fissure)','Roughly follows the line of the 4th rib/costal cartilage anteriorly','Meets the oblique fissure at the mid-axillary line']},

{id:'w3-trachea',name:'Trachea',category:'Organ',week:3,region:'Neck/superior mediastinum',wiki:'Trachea',
 description:'Fibrocartilaginous tube reinforced by C-shaped cartilage rings, extending from the cricoid cartilage (C6) to its bifurcation into the main bronchi at the sternal angle (T4/T5).',
 clinical:'Tracheal deviation on chest X-ray indicates mediastinal shift (e.g. tension pneumothorax pushes away, atelectasis pulls toward); site of emergency cricothyroidotomy/tracheostomy access.',
 facts:['Reinforced by 16-20 C-shaped cartilage rings, open posteriorly where trachealis muscle allows esophageal expansion during swallowing','Bifurcates at the carina, at the level of the sternal angle (T4/T5)','The right main bronchus is wider, shorter, and more vertical than the left']},

{id:'w3-main-bronchi',name:'Main Bronchi (Left/Right)',category:'Organ',week:3,region:'Superior mediastinum/hila',wiki:'Bronchus',
 description:'Paired airways formed at the tracheal bifurcation, each entering the lung at the hilum and dividing into lobar bronchi.',
 clinical:'The right main bronchus\'s wider, more vertical course makes it the more common site for aspirated foreign bodies to lodge.',
 facts:['Right main bronchus is shorter, wider, and more vertical than the left','Left main bronchus is longer and passes inferior to the aortic arch','Each divides into lobar (secondary) bronchi, then segmental (tertiary) bronchi supplying bronchopulmonary segments']},
{id:'w3-celiac-trunk',name:'Celiac Trunk',category:'Artery',week:3,region:'Abdomen',wiki:'Celiac artery',
 description:'First unpaired anterior branch of the abdominal aorta, arising at T12 and dividing almost immediately into the left gastric, splenic, and common hepatic arteries.',
 clinical:'Median arcuate ligament syndrome results from compression of the celiac trunk by the diaphragmatic crura, causing postprandial abdominal pain.',
 facts:['Supplies the foregut derivatives — distal esophagus to the second part of the duodenum, plus liver, spleen, and pancreas','Very short trunk, typically only 1-2cm long before trifurcating','Median arcuate ligament passes just above its origin, occasionally compressing it'],
 arteryOrigin:'Anterior abdominal aorta at approximately T12', arteryBranches:['Left gastric artery','Splenic artery','Common hepatic artery'], areasSupplied:'Foregut derivatives: distal esophagus, stomach, proximal duodenum, liver, gallbladder, pancreas, spleen'},

{id:'w3-splenic-artery',name:'Splenic Artery',category:'Artery',week:3,region:'Abdomen',wiki:'Splenic artery',
 description:'Largest branch of the celiac trunk, following a tortuous course along the superior border of the pancreas to the spleen, giving off pancreatic and gastric branches en route.',
 clinical:'Its tortuous retroperitoneal course makes it a recognized site of splenic artery aneurysm, with rupture risk increased in pregnancy.',
 facts:['Runs a characteristically tortuous course along the superior border of the pancreas','Gives off short gastric arteries and the left gastro-omental artery near its termination','Terminates by dividing into multiple branches entering the splenic hilum'],
 arteryOrigin:'Celiac trunk', arteryBranches:['Pancreatic branches','Short gastric arteries','Left gastro-omental (gastroepiploic) artery','Splenic branches'], areasSupplied:'Spleen, pancreas (body/tail), greater curvature of the stomach (via left gastro-omental)'},

{id:'w3-common-hepatic-artery',name:'Common Hepatic Artery',category:'Artery',week:3,region:'Abdomen',wiki:'Common hepatic artery',
 description:'Branch of the celiac trunk running toward the liver, giving off the gastroduodenal artery before continuing as the hepatic artery proper within the hepatoduodenal ligament.',
 clinical:'Forms part of the boundary of the epiploic (omental) foramen and is palpated/ligated with care during cholecystectomy given its proximity to Calot\'s triangle.',
 facts:['Divides into the gastroduodenal artery and hepatic artery proper','Hepatic artery proper runs within the hepatoduodenal ligament alongside the portal vein and common bile duct (the "portal triad")','Gastroduodenal artery supplies the pylorus, proximal duodenum, and pancreatic head'],
 arteryOrigin:'Celiac trunk', arteryBranches:['Gastroduodenal artery','Hepatic artery proper → right and left hepatic arteries, right gastric artery'], areasSupplied:'Liver, gallbladder, pylorus, proximal duodenum, pancreatic head'},

{id:'w3-left-gastric-artery',name:'Left Gastric Artery',category:'Artery',week:3,region:'Abdomen',wiki:'Left gastric artery',
 description:'Smallest branch of the celiac trunk, ascending to the esophagogastric junction before running along the lesser curvature of the stomach.',
 clinical:'A key anastomotic connection between the systemic and portal venous systems at the esophagogastric junction (esophageal varices form here in portal hypertension).',
 facts:['Smallest of the three celiac trunk branches','Gives off esophageal branches that anastomose with esophageal branches of the thoracic aorta','Anastomoses with the right gastric artery along the lesser curvature'],
 arteryOrigin:'Celiac trunk', arteryBranches:['Esophageal branches','Gastric branches'], areasSupplied:'Lesser curvature of the stomach, distal esophagus'},

{id:'w3-sma',name:'Superior Mesenteric Artery',category:'Artery',week:3,region:'Abdomen',wiki:'Superior mesenteric artery',
 description:'Second unpaired anterior branch of the abdominal aorta, arising at L1 and supplying the midgut derivatives from the distal duodenum to the proximal two-thirds of the transverse colon.',
 clinical:'Acute SMA occlusion (embolism or thrombosis) causes mesenteric ischemia, a surgical emergency; the SMA can also compress the third part of the duodenum (SMA syndrome).',
 facts:['Crosses anterior to the third part of the duodenum and the left renal vein','Gives rise to the ileocolic, right colic, and middle colic arteries supplying the midgut','Marginal artery formed by its branches provides collateral circulation to the colon'],
 arteryOrigin:'Anterior abdominal aorta at approximately L1', arteryBranches:['Inferior pancreaticoduodenal artery','Jejunal and ileal arteries','Ileocolic artery','Right colic artery','Middle colic artery'], areasSupplied:'Midgut derivatives: distal duodenum to proximal two-thirds of the transverse colon'},

{id:'w3-ima',name:'Inferior Mesenteric Artery',category:'Artery',week:3,region:'Abdomen',wiki:'Inferior mesenteric artery',
 description:'Third unpaired anterior branch of the abdominal aorta, arising at L3 and supplying the hindgut derivatives from the distal transverse colon to the upper rectum.',
 clinical:'The "watershed" junction between SMA and IMA territories at the splenic flexure is particularly vulnerable to ischemic colitis during hypotension.',
 facts:['Arises well below the SMA, at approximately L3','Gives rise to the left colic, sigmoid, and superior rectal arteries','Supplies the hindgut: distal transverse colon, descending colon, sigmoid colon, and upper rectum'],
 arteryOrigin:'Anterior abdominal aorta at approximately L3', arteryBranches:['Left colic artery','Sigmoid arteries','Superior rectal artery'], areasSupplied:'Hindgut derivatives: distal transverse colon to upper rectum'},

{id:'w3-renal-artery',name:'Renal Artery',category:'Artery',week:3,region:'Abdomen',wiki:'Renal artery',
 description:'Paired large lateral branches of the abdominal aorta arising just below the SMA (approximately L1-L2), each dividing into segmental arteries before entering the kidney at the hilum.',
 clinical:'Renal artery stenosis (often from atherosclerosis or fibromuscular dysplasia) is a cause of secondary hypertension via activation of the renin-angiotensin system.',
 facts:['Right renal artery is longer and passes posterior to the IVC to reach the right kidney','Renal arteries are end arteries with minimal collateral circulation, making segments vulnerable to infarction if occluded','Divide into segmental, then interlobar, arcuate, and interlobular arteries within the kidney'],
 arteryOrigin:'Abdominal aorta, just inferior to the origin of the SMA', arteryBranches:['Segmental arteries','Inferior suprarenal artery (branch to the adrenal gland)'], areasSupplied:'Kidney'},

{id:'w3-suprarenal-arteries',name:'Suprarenal Arteries',category:'Artery',week:3,region:'Abdomen',wiki:'Suprarenal gland',
 description:'Three paired arteries (superior, middle, inferior) supplying each adrenal gland from three different sources, reflecting its dual cortical/medullary embryology and high metabolic demand.',
 clinical:'The adrenal gland\'s rich, triple blood supply but single venous drainage makes venous thrombosis (rather than arterial insufficiency) the more clinically significant vascular vulnerability.',
 facts:['Superior suprarenal artery arises from the inferior phrenic artery','Middle suprarenal artery arises directly from the abdominal aorta','Inferior suprarenal artery arises from the renal artery'],
 arteryOrigin:'Superior: inferior phrenic artery; Middle: abdominal aorta directly; Inferior: renal artery', arteryBranches:['Capsular and glandular branches'], areasSupplied:'Adrenal (suprarenal) gland'},

{id:'w3-pulmonary-trunk',name:'Pulmonary Trunk',category:'Artery',week:3,region:'Mediastinum',wiki:'Pulmonary artery',
 description:'Large vessel arising from the right ventricle, ascending briefly before dividing into right and left pulmonary arteries that carry deoxygenated blood to the lungs.',
 clinical:'Site of pulmonary embolism, where thrombus (often from lower limb DVT) lodges and obstructs pulmonary blood flow, causing acute right heart strain.',
 facts:['The only artery in the body normally carrying deoxygenated blood','Connected to the aortic arch by the ligamentum arteriosum (fetal ductus arteriosus remnant)','Bifurcates into right and left pulmonary arteries within the pericardial sac'],
 arteryOrigin:'Right ventricle, at the pulmonary valve', arteryBranches:['Right pulmonary artery','Left pulmonary artery'], areasSupplied:'Lungs (for gas exchange, not nutritive supply — that comes from bronchial arteries)'},

{id:'w3-hepatic-portal-vein',name:'Hepatic Portal Vein',category:'Vein',week:3,region:'Abdomen',wiki:'Hepatic portal vein',
 description:'Large vein formed by the union of the splenic and superior mesenteric veins behind the neck of the pancreas, carrying nutrient-rich blood from the GI tract, spleen, and pancreas to the liver.',
 clinical:'Portal hypertension (often from cirrhosis) causes portosystemic collateral dilation, including esophageal varices, caput medusae, and hemorrhoids.',
 facts:['Formed behind the neck of the pancreas by the union of the splenic and superior mesenteric veins','Runs within the hepatoduodenal ligament alongside the hepatic artery proper and common bile duct (portal triad)','Delivers about 75% of the liver\'s blood supply (the rest from the hepatic artery)'],
 veinDrainage:'GI tract (stomach to upper rectum), spleen, and pancreas', veinTributaries:['Splenic vein','Superior mesenteric vein','Left and right gastric veins','Cystic vein'], veinTermination:'Divides into right and left branches within the liver, draining into hepatic sinusoids'},

{id:'w3-splenic-vein',name:'Splenic Vein',category:'Vein',week:3,region:'Abdomen',wiki:'Splenic vein',
 description:'Vein draining the spleen, running posterior to the pancreas and joining the superior mesenteric vein to form the hepatic portal vein.',
 clinical:'Isolated splenic vein thrombosis (e.g. from pancreatitis or pancreatic cancer) causes sinistral (left-sided) portal hypertension with isolated gastric varices.',
 facts:['Runs posterior to the body and tail of the pancreas','Receives the inferior mesenteric vein in most people before joining the SMV','Joins the superior mesenteric vein behind the pancreatic neck to form the portal vein'],
 veinDrainage:'Spleen, pancreas, and part of the stomach', veinTributaries:['Short gastric veins','Left gastro-omental vein','Pancreatic veins','Inferior mesenteric vein (usually)'], veinTermination:'Joins the superior mesenteric vein to form the hepatic portal vein'},

{id:'w3-smv',name:'Superior Mesenteric Vein',category:'Vein',week:3,region:'Abdomen',wiki:'Superior mesenteric vein',
 description:'Vein draining the midgut, running alongside the superior mesenteric artery and joining the splenic vein behind the pancreatic neck to form the portal vein.',
 clinical:'Lies immediately to the right of the SMA, an important relationship in identifying midgut malrotation on imaging (normal SMV is right of SMA).',
 facts:['Drains the same territory as the SMA supplies — midgut derivatives','Lies to the right of the superior mesenteric artery','Unites with the splenic vein posterior to the pancreatic neck to form the hepatic portal vein'],
 veinDrainage:'Midgut derivatives: distal duodenum to proximal transverse colon', veinTributaries:['Jejunal and ileal veins','Ileocolic vein','Right colic vein','Middle colic vein'], veinTermination:'Joins the splenic vein to form the hepatic portal vein'},

{id:'w3-imv',name:'Inferior Mesenteric Vein',category:'Vein',week:3,region:'Abdomen',wiki:'Inferior mesenteric vein',
 description:'Vein draining the hindgut, ascending retroperitoneally and typically draining into the splenic vein (variably into the SMV or the splenic-SMV junction).',
 clinical:'Its drainage territory (hindgut) corresponds to the IMA supply; relevant landmark in colorectal surgery near the ligament of Treitz.',
 facts:['Drains the same territory as the IMA supplies — hindgut derivatives','Most commonly drains into the splenic vein, but variably into the SMV directly','Ascends more medially than the IMA it accompanies for part of its course'],
 veinDrainage:'Hindgut derivatives: distal transverse colon to upper rectum', veinTributaries:['Left colic vein','Sigmoid veins','Superior rectal vein'], veinTermination:'Usually the splenic vein (variably the SMV)'},

{id:'w3-hepatic-veins',name:'Hepatic Veins',category:'Vein',week:3,region:'Liver',wiki:'Hepatic veins',
 description:'Typically three large veins (right, middle, left) draining venous blood from the liver directly into the inferior vena cava just below the diaphragm.',
 clinical:'Budd-Chiari syndrome results from hepatic vein thrombosis/obstruction, causing painful hepatomegaly and ascites.',
