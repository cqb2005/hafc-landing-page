<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy Visual Flashcards</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --border:#d7dbe0; --text:#1c2230; --muted:#5b6472;
    --accent:#2454ff; --accent-dark:#173bb0; --green:#1f8a4c; --red:#c23b3b; --tag:#e7ebf3;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{max-width:900px;margin:0 auto;padding:12px 14px 60px;}
  header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;}
  header h1{font-size:1.25rem;margin:0;}
  #stats{display:flex;gap:14px;font-size:0.9rem;flex-wrap:wrap;}
  #stats span{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:4px 10px;}
  #scoreCorrect{color:var(--green);font-weight:600;}
  #scoreIncorrect{color:var(--red);font-weight:600;}
  #filters{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:0.85rem;}
  #filters .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;}
  #filters .row:last-child{margin-bottom:0;}
  #filters label{display:inline-flex;align-items:center;gap:4px;background:var(--tag);border-radius:5px;padding:3px 8px;cursor:pointer;}
  #categoryFilters label{user-select:none;}
  select{padding:4px 6px;border-radius:5px;border:1px solid var(--border);}
  #quickFilters button, #modeFilters label, #resetProgress{cursor:pointer;}
  #quickFilters{display:flex;flex-wrap:wrap;gap:6px;}
  #quickFilters button{background:#fff;border:1px solid var(--border);border-radius:5px;padding:4px 9px;font-size:0.8rem;}
  #quickFilters button:hover{background:var(--tag);}
  #modeFilters{display:flex;gap:10px;flex-wrap:wrap;}
  #resetProgress{margin-left:auto;background:#fff;border:1px solid var(--red);color:var(--red);border-radius:5px;padding:4px 10px;font-size:0.8rem;}
  #cardArea{background:var(--panel);border:1px solid var(--border);border-radius:10px;min-height:420px;display:flex;flex-direction:column;}
  #flashcard{flex:1;display:flex;flex-direction:column;padding:16px;}
  .face{flex:1;display:flex;flex-direction:column;}
  #cardFront{align-items:center;justify-content:center;text-align:center;}
  #imgWrap{width:100%;max-width:520px;min-height:280px;display:flex;align-items:center;justify-content:center;background:#eef0f4;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  #cardImg{max-width:100%;max-height:380px;display:none;object-fit:contain;}
  #imgFallback{padding:20px;color:var(--muted);font-size:0.9rem;}
  #imgCredit{font-size:0.72rem;color:var(--muted);margin-top:6px;}
  #hintText{font-size:0.8rem;color:var(--muted);margin-top:10px;}
  #backContent h2{margin:0 0 4px;font-size:1.3rem;}
  #backContent h3{margin:14px 0 4px;font-size:0.85rem;text-transform:uppercase;letter-spacing:.03em;color:var(--accent-dark);}
  #backContent p{margin:2px 0;line-height:1.45;}
  #backContent ul{margin:2px 0;padding-left:20px;line-height:1.45;}
  .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .tag{background:var(--tag);border-radius:4px;padding:2px 8px;font-size:0.75rem;color:var(--muted);}
  .desc{font-style:italic;color:var(--text);}
  #controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px 0 4px;}
  #controls button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:9px 16px;font-size:0.9rem;cursor:pointer;}
  #controls button:hover{background:var(--accent-dark);}
  #btnIncorrect{background:var(--red);}
  #btnIncorrect:hover{background:#8f2b2b;}
  #btnCorrect{background:var(--green);}
  #btnCorrect:hover{background:#156a39;}
  #btnCorrect.active-status{outline:3px solid #16552f;}
  #btnIncorrect.active-status{outline:3px solid #7a1f1f;}
  footer{text-align:center;color:var(--muted);font-size:0.75rem;margin-top:16px;}
  @media (max-width:480px){
    #controls button{flex:1 1 40%;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Anatomy Visual Flashcards</h1>
    <div id="stats">
      <span id="progress">0 / 0</span>
      <span id="scoreCorrect">Correct: 0</span>
      <span id="scoreIncorrect">Incorrect: 0</span>
    </div>
  </header>

  <div id="filters">
    <div class="row">
      <label>Week:
        <select id="weekFilter">
          <option value="all">All weeks</option>
          <option value="1">Week 1 — Thoracic</option>
          <option value="2">Week 2 — Lumbar</option>
          <option value="3">Week 3 — Viscera</option>
        </select>
      </label>
      <div id="modeFilters">
        <label><input type="radio" name="mode" value="sequential" checked> Sequential</label>
        <label><input type="radio" name="mode" value="random"> Random Mode</label>
        <label><input type="radio" name="mode" value="review"> Review Incorrect</label>
      </div>
      <button id="resetProgress">Reset Progress</button>
    </div>
    <div class="row" id="quickFilters">
      <button data-quick="all">All Categories</button>
      <button data-quick="Muscle">Muscles Only</button>
      <button data-quick="Bone">Bones</button>
      <button data-quick="Joint">Joints</button>
      <button data-quick="Ligament">Ligaments</button>
      <button data-quick="Nerve">Nerves</button>
      <button data-quick="Vessel">Vessels</button>
      <button data-quick="Lymph">Lymph</button>
      <button data-quick="Fascia">Fascia</button>
    </div>
    <div class="row" id="categoryFilters"></div>
  </div>

  <div id="cardArea">
    <div id="flashcard">
      <div id="cardFront" class="face">
        <div id="imgWrap">
          <img id="cardImg" alt="">
          <div id="imgFallback" hidden></div>
        </div>
        <div id="imgCredit"></div>
        <div id="hintText">Image is unlabeled — identify the structure, then flip to check. (Press Space to flip, ← → to navigate)</div>
      </div>
      <div id="cardBack" class="face" hidden>
        <div id="backContent"></div>
      </div>
    </div>
    <div id="controls">
      <button id="btnFlip">Flip</button>
      <button id="btnPrev">Previous</button>
      <button id="btnNext">Next</button>
      <button id="btnShuffle">Shuffle</button>
      <button id="btnCorrect">Mark Correct</button>
      <button id="btnIncorrect">Mark Incorrect</button>
    </div>
  </div>
  <footer>Images load live from Wikipedia/Wikimedia (requires internet). Data stored locally in your browser via localStorage.</footer>
</div>

<script>
const CATEGORIES = ['Bone','Joint','Ligament','Muscle','Nerve','Artery','Vein','Lymph','Fascia','Organ'];

/* ======================= CARD DATA ======================= */
/* Edit or add cards freely — each object is independent. */
const CARDS = [
/*WEEK1_START*/
{id:'w1-spinous-process',name:'Spinous Process',category:'Bone',week:1,region:'Thoracic vertebra',wiki:'Spinous process',
 description:'Posterior midline projection of the vertebral arch formed by the union of the two laminae.',
 clinical:'Palpated to count vertebral levels and localize lumbar puncture/epidural sites; avulsion causes clay-shoveler\'s fracture.',
 facts:['Thoracic spinous processes are long, slender, and steeply angled inferiorly so they overlap the vertebra below','C7 spinous process ("vertebra prominens") is the first easily palpable process','Bifid in cervical vertebrae, single in thoracic and lumbar'],
 boneLandmarks:['Tip projects posteriorly/inferiorly from the junction of the laminae'],
 boneArticulations:['None — non-synovial'],
 boneAttachments:['Supraspinous ligament, interspinous ligaments, multifidus, trapezius, rhomboid muscles']},

{id:'w1-transverse-process',name:'Transverse Process',category:'Bone',week:1,region:'Thoracic vertebra',wiki:'Transverse process',
 description:'Paired lateral projections of the vertebral arch arising at the junction of the pedicle and lamina.',
 clinical:'Thoracic transverse processes bear costal facets and can fracture with direct trauma or avulse with forceful erector spinae contraction.',
 facts:['T1–T10 transverse processes carry a transverse costal facet for the rib tubercle','Serve as levers for the deep back muscles','Site of costotransverse ligament attachment'],
 boneLandmarks:['Tip palpable ~2-3cm lateral to the spinous process'],
 boneArticulations:['Transverse costal facet articulates with the rib tubercle (T1-T10)'],
 boneAttachments:['Costotransverse ligaments, iliocostalis, longissimus, levatores costarum, intertransverse ligaments']},

{id:'w1-pedicle',name:'Pedicle',category:'Bone',week:1,region:'Vertebra',wiki:'Pedicle of vertebral arch',
 description:'Short, stout bony pillar connecting the vertebral body to the transverse process/lamina junction, forming the lateral wall of the vertebral foramen.',
 clinical:'The strongest part of the vertebra and the entry point for transpedicular screws in spinal fixation; its notches form the intervertebral foramen for the spinal nerve.',
 facts:['Forms the superior and inferior vertebral notches','Connects the vertebral body anteriorly to the posterior elements','Seen as the "owl\'s eyes" on an AP vertebral X-ray'],
 boneLandmarks:['Superior vertebral notch, inferior vertebral notch'],
 boneArticulations:['Continuous with vertebral body and lamina — not a true joint'],
 boneAttachments:['No major ligament/muscle attachment; forms boundary of intervertebral foramen']},

{id:'w1-lamina',name:'Lamina',category:'Bone',week:1,region:'Vertebra',wiki:'Vertebral arch',
 description:'Flattened plate of bone extending posteromedially from each pedicle to meet its partner in the midline and form the spinous process.',
 clinical:'Removed in a laminectomy to decompress the spinal cord/cauda equina; congenital non-fusion produces spina bifida occulta.',
 facts:['Forms the posterior wall of the vertebral (spinal) canal','Gives attachment to ligamentum flavum on its anterior surface','Fuses in the midline to form the spinous process'],
 boneLandmarks:['Smooth anterior surface facing the vertebral canal'],
 boneArticulations:['None directly'],
 boneAttachments:['Ligamentum flavum, multifidus']},

{id:'w1-sup-costal-facet',name:'Superior Costal Facet',category:'Bone',week:1,region:'Thoracic vertebral body',wiki:'Costal facet',
 description:'Smooth articular facet on the posterolateral aspect of the upper thoracic vertebral body that receives the head of the corresponding rib.',
 clinical:'T1 and T10-T12 have a single complete costal facet rather than demi-facets — a key feature for identifying atypical thoracic vertebrae.',
 facts:['T2-T9 have superior and inferior demi-facets that combine with the adjacent vertebra to cradle one rib head','Part of the costovertebral joint','Located near the pedicle'],
 boneLandmarks:['Superior demi-facet at the upper posterolateral vertebral body'],
 boneArticulations:['Head of the corresponding/adjacent rib at the costovertebral joint'],
 boneAttachments:['Radiate ligament of the head of rib']},

{id:'w1-inf-costal-facet',name:'Inferior Costal Facet',category:'Bone',week:1,region:'Thoracic vertebral body',wiki:'Costal facet',
 description:'Smooth articular facet on the inferior posterolateral vertebral body that articulates with the head of the rib below.',
 clinical:'Combines with the superior demi-facet of the vertebra below to cradle a single rib head, so most ribs articulate with two vertebrae.',
 facts:['Present on T1-T9 typically as a demi-facet','Absent on T11-T12, which articulate with only their own numbered vertebra','Part of the costovertebral joint complex'],
 boneLandmarks:['Inferior demi-facet at the lower posterolateral vertebral body'],
 boneArticulations:['Head of the numerically corresponding rib'],
 boneAttachments:['Radiate ligament of the head of rib']},

{id:'w1-trans-costal-facet',name:'Transverse Costal Facet',category:'Bone',week:1,region:'Thoracic transverse process',wiki:'Costal facet',
 description:'Small oval facet on the anterior tip of thoracic transverse processes (T1-T10) that articulates with the tubercle of the corresponding rib.',
 clinical:'Absent on T11 and T12, which therefore lack a costotransverse joint — a key distinguishing feature of atypical lower thoracic vertebrae.',
 facts:['Forms the costotransverse joint with the rib tubercle','Orientation changes from plane superiorly to more saddle-shaped inferiorly, altering rib movement','Present only T1-T10'],
 boneLandmarks:['Tip of transverse process'],
 boneArticulations:['Tubercle of the numerically corresponding rib'],
 boneAttachments:['Costotransverse ligament, lateral costotransverse ligament']},

{id:'w1-sup-articular-process',name:'Superior Articular Process and Facet',category:'Bone',week:1,region:'Vertebra',wiki:'Superior articular process',
 description:'Paired bony projections arising from the pedicle-lamina junction that project superiorly and bear a facet articulating with the inferior articular process of the vertebra above.',
 clinical:'Facet orientation in the thoracic spine (near-coronal plane) favors rotation but limits flexion/extension; facet arthropathy here is a source of back pain.',
 facts:['Thoracic superior facets face posterolaterally (near-coronal plane)','Forms the zygapophyseal (facet) joint','Guides the type of motion available at each spinal region'],
 boneLandmarks:['Facet faces posterior and slightly superior/lateral in the thoracic spine'],
 boneArticulations:['Inferior articular process of the vertebra above — zygapophyseal joint'],
 boneAttachments:['Joint capsule of the facet joint']},

{id:'w1-inf-articular-process',name:'Inferior Articular Process and Facet',category:'Bone',week:1,region:'Vertebra',wiki:'Inferior articular process',
 description:'Paired bony projections arising from the lamina that project inferiorly and articulate with the superior articular processes of the vertebra below.',
 clinical:'Fracture of the pars interarticularis (between superior and inferior articular processes) causes spondylolysis, most common in the lumbar spine.',
 facts:['Facet faces anteromedially in the thoracic spine, opposite the superior facet above','Completes the zygapophyseal joint','Located just lateral to the lamina'],
 boneLandmarks:['Facet faces anterior and medial in the thoracic spine'],
 boneArticulations:['Superior articular process of the vertebra below'],
 boneAttachments:['Joint capsule of the facet joint']},

{id:'w1-vertebral-notch',name:'Vertebral Notch',category:'Bone',week:1,region:'Vertebra (pedicle)',wiki:'Vertebral notch',
 description:'Concavity on the superior and inferior borders of the pedicle; the inferior notch of one vertebra plus the superior notch of the vertebra below form the intervertebral foramen.',
 clinical:'The intervertebral foramen formed here is the exit point for the spinal nerve root and a common site of nerve compression in disc herniation or foraminal stenosis.',
 facts:['Inferior vertebral notch is deeper than the superior notch','Intervertebral foramen also transmits the dorsal root ganglion and spinal vessels','Foraminal narrowing causes radiculopathy'],
 boneLandmarks:['Superior and inferior notch on the pedicle borders'],
 boneArticulations:['Forms boundary of the intervertebral foramen, not a joint itself'],
 boneAttachments:['None significant']},

{id:'w1-true-rib',name:'True Rib',category:'Bone',week:1,region:'Thoracic cage',wiki:'Rib',
 description:'Ribs 1-7, each of which attaches directly to the sternum via its own costal cartilage.',
 clinical:'Fractures of true ribs (especially 4-9, the most commonly fractured) can lacerate the underlying pleura or lung, causing pneumothorax.',
 facts:['Also called vertebrosternal ribs','Costal cartilage of each true rib articulates independently with the sternum','Ribs 1-3 are also atypical in shape'],
 boneLandmarks:['Head, neck, tubercle, shaft, costal groove as in typical ribs 3-9'],
 boneArticulations:['Vertebra (costovertebral, costotransverse) and sternum (sternocostal joint) directly'],
 boneAttachments:['Intercostal muscles, costal cartilage']},

{id:'w1-false-rib',name:'False Rib',category:'Bone',week:1,region:'Thoracic cage',wiki:'Rib',
 description:'Ribs 8-12, whose costal cartilages do not attach directly to the sternum.',
 clinical:'Ribs 11-12 (floating ribs) have no anterior attachment at all and are more mobile, relevant when assessing penetrating flank trauma to kidney/spleen.',
 facts:['Ribs 8-10 cartilages fuse to the cartilage of rib 7 above, forming the costal margin','Ribs 11-12 are "floating ribs" with free anterior ends','Costal margin formed by ribs 7-10 cartilages is a surface landmark'],
 boneLandmarks:['Costal margin formed by fused cartilages 7-10'],
 boneArticulations:['Costovertebral/costotransverse posteriorly; indirect or absent sternal attachment anteriorly'],
 boneAttachments:['Intercostal muscles, external/internal oblique aponeuroses near the costal margin']},

{id:'w1-typical-rib',name:'Typical Rib',category:'Bone',week:1,region:'Thoracic cage',wiki:'Rib',
 description:'Ribs 3-9, sharing the standard structure of a head with two articular facets, neck, tubercle, angle, shaft, and costal groove.',
 clinical:'Understanding typical rib anatomy is the baseline for identifying the atypical ribs (1, 2, 10, 11, 12) on imaging and in the anatomy lab.',
 facts:['Head has two demi-facets separated by an interarticular crest','Tubercle has a facet for the transverse process','Costal groove on the inferior internal shaft houses the neurovascular bundle'],
 boneLandmarks:['Head, neck, tubercle, angle, shaft, costal groove'],
 boneArticulations:['Two vertebral bodies at the costovertebral joint, one transverse process at the costotransverse joint'],
 boneAttachments:['External/internal/innermost intercostals, levatores costarum, radiate and costotransverse ligaments']},

{id:'w1-atypical-rib',name:'Atypical Rib',category:'Bone',week:1,region:'Thoracic cage',wiki:'Rib',
 description:'Ribs 1, 2, 10, 11 and 12, each of which deviates from the typical rib pattern in shape or articulation.',
 clinical:'Rib 1 is the most clinically relevant atypical rib — it can compress the subclavian vessels/brachial plexus in thoracic outlet syndrome.',
 facts:['Rib 1 is short, flat, with only one facet for T1 (no demi-facet)','Rib 2 is thin, longer, with a tuberosity for serratus anterior','Ribs 11-12 have only a single facet, no tubercle/neck, and no costotransverse joint'],
 boneLandmarks:['Varies by rib — e.g. scalene tubercle on rib 1'],
 boneArticulations:['Rib 1: T1 only; Ribs 11-12: single corresponding vertebra only, no transverse process facet'],
 boneAttachments:['Rib 1: scalenus anterior/medius; Rib 2: serratus anterior first digitation']},

{id:'w1-rib-shaft',name:'Rib Shaft (Body of Rib)',category:'Bone',week:1,region:'Thoracic cage',wiki:'Rib',
 description:'Thin, curved, flattened portion of the rib extending from the angle to the anterior costal cartilage.',
 clinical:'Thinnest and weakest just anterior to the angle, a common fracture site in blunt chest trauma.',
 facts:['Has external and internal surfaces and superior/inferior borders','Inferior internal border carries the costal groove','Twists along its length, giving the rib its curved 3-D shape'],
 boneLandmarks:['Angle, costal groove, superior/inferior borders'],
 boneArticulations:['Costal cartilage at the anterior end'],
 boneAttachments:['Intercostal muscles along its length']},

{id:'w1-rib-head',name:'Head of Rib',category:'Bone',week:1,region:'Posterior rib',wiki:'Rib',
 description:'Wedge-shaped proximal end of a typical rib bearing two articular demi-facets separated by the interarticular crest.',
 clinical:'Forms the costovertebral joint; the interarticular crest anchors the intra-articular ligament of the head of rib, dividing the joint into two synovial cavities.',
 facts:['Superior facet is smaller than the inferior facet','Ribs 1, 10, 11, 12 have only a single facet on the head','Connected to the radiate ligament anteriorly'],
 boneLandmarks:['Interarticular crest, superior and inferior demi-facets'],
 boneArticulations:['Bodies of two adjacent thoracic vertebrae at the costovertebral joint'],
 boneAttachments:['Radiate ligament, intra-articular ligament of the head of rib']},

{id:'w1-rib-neck',name:'Neck of Rib',category:'Bone',week:1,region:'Posterior rib',wiki:'Rib',
 description:'Flattened bony segment connecting the head of the rib to the tubercle, lying anterior to the corresponding transverse process.',
 clinical:'Crossed posteriorly by the sympathetic trunk; the superior border gives attachment to the costotransverse ligament.',
 facts:['Approximately 2.5cm long','Separates head from tubercle','Related posteriorly to the sympathetic chain and costotransverse ligament'],
 boneLandmarks:['Superior and inferior crests'],
 boneArticulations:['None directly — connects head and tubercle'],
 boneAttachments:['Costotransverse ligament, superior costotransverse ligament']},

{id:'w1-costal-groove',name:'Costal Groove',category:'Bone',week:1,region:'Internal rib shaft',wiki:'Costal groove',
 description:'Shallow groove along the inferior internal surface of the rib shaft that lodges the intercostal neurovascular bundle (vein, artery, nerve, superior to inferior).',
 clinical:'Because the neurovascular bundle runs just below the superior rib margin here, needles/chest tubes are inserted just above the rib below to avoid injury — a key clinical safety rule.',
 facts:['Houses intercostal vein, artery, and nerve in that order top to bottom (VAN)','Most distinct in the mid-shaft, fades anteriorly','Protects the neurovascular bundle from compression'],
 boneLandmarks:['Groove on the internal, inferior aspect of the shaft'],
 boneArticulations:['Not applicable'],
 boneAttachments:['Innermost intercostal muscle attaches near the groove margins']},

{id:'w1-rib-tubercle',name:'Tubercle of Rib',category:'Bone',week:1,region:'Posterior rib',wiki:'Rib',
 description:'Bony prominence at the junction of the neck and shaft bearing an articular facet (in typical ribs) for the transverse process of the corresponding vertebra.',
 clinical:'Absent facet component on ribs 11-12 (no costotransverse joint) — an important atypical-rib exam point.',
 facts:['Located posterior to the neck at the neck-shaft junction','Articular part is medial, non-articular part lateral for ligament attachment','Landmark separating neck from shaft'],
 boneLandmarks:['Articular and non-articular portions'],
 boneArticulations:['Transverse process of the corresponding vertebra (T1-T10) at the costotransverse joint'],
 boneAttachments:['Lateral costotransverse ligament attaches to the non-articular part']},

{id:'w1-rib-articular-facet',name:'Articular Facet (of Rib Tubercle)',category:'Bone',week:1,region:'Rib tubercle',wiki:'Costotransverse joint',
 description:'Smooth oval facet on the medial part of the rib tubercle that articulates with the transverse costal facet of the vertebra.',
 clinical:'This synovial joint allows gliding rib movement during respiration; its orientation changes progressively down the thoracic cage, altering the axis of rib motion from "pump-handle" to "bucket-handle."',
 facts:['Convex in upper ribs, flatter in lower ribs','Forms the costotransverse joint with the transverse costal facet','Surrounded by a thin synovial capsule'],
 boneLandmarks:['Located on the medial tubercle'],
 boneArticulations:['Transverse process facet'],
 boneAttachments:['Joint capsule, costotransverse ligament']},

{id:'w1-manubrium',name:'Manubrium',category:'Bone',week:1,region:'Sternum',wiki:'Manubrium',
 description:'Trapezoidal superior segment of the sternum that articulates with the clavicles, first two ribs, and the sternal body.',
 clinical:'The manubriosternal joint (sternal angle / angle of Louis) marks the level of the 2nd costal cartilage, T4/T5, tracheal bifurcation, and aortic arch boundaries — a critical surface landmark.',
 facts:['Has clavicular notches laterally for the sternoclavicular joints','Bears facets for costal cartilage of rib 1 and part of rib 2','Thicker and wider than the sternal body'],
 boneLandmarks:['Jugular (suprasternal) notch, clavicular notch, sternal angle'],
 boneArticulations:['Clavicle (sternoclavicular joint), rib 1 cartilage (synchondrosis), rib 2 cartilage (partly), sternal body (manubriosternal joint)'],
 boneAttachments:['Sternocleidomastoid, sternohyoid, sternothyroid']},

{id:'w1-sternal-body',name:'Body of Sternum',category:'Bone',week:1,region:'Sternum',wiki:'Sternum',
 description:'Long flat middle segment of the sternum formed from fusion of four sternebrae, articulating with costal cartilages of ribs 2-7.',
 clinical:'Common site for bone marrow aspiration (sternal puncture) due to its subcutaneous position and red marrow content.',
 facts:['Formed by fusion of 4 sternebrae, sometimes visible as transverse ridges','Articulates with costal cartilages 2-7 along its lateral borders','Joins the xiphoid process at the xiphisternal joint'],
 boneLandmarks:['Transverse ridges marking sternebral fusion lines'],
 boneArticulations:['Costal cartilages of ribs 2-7 (sternocostal joints), manubrium (manubriosternal joint), xiphoid process (xiphisternal joint)'],
 boneAttachments:['Pectoralis major, transversus thoracis (internally)']},

{id:'w1-xiphoid',name:'Xiphoid Process',category:'Bone',week:1,region:'Sternum',wiki:'Xiphoid process',
 description:'Small, variably ossified cartilaginous-to-bony inferior tip of the sternum.',
 clinical:'Landmark for correct hand position during chest compressions in CPR (avoid pressing directly on it — can fracture and lacerate the liver); marks the T9 level and inferior heart border.',
 facts:['Remains cartilaginous until middle age in many people','Site of attachment for rectus abdominis and diaphragm fibers','Xiphisternal joint here marks the T9 level and the inferior border of the pericardial sac'],
 boneLandmarks:['Variable shape — pointed, bifid, or curved'],
 boneArticulations:['Sternal body at the xiphisternal joint'],
 boneAttachments:['Rectus abdominis (some fibers), linea alba, diaphragm']},
{id:'w1-facet-joint',name:'Thoracic Facet Joint',category:'Joint',week:1,region:'Thoracic vertebra',wiki:'Zygapophyseal joint',
 description:'Synovial plane joint between the superior articular process of one vertebra and the inferior articular process of the vertebra above.',
 clinical:'A common source of mechanical back pain; can be targeted with medial branch blocks/radiofrequency ablation for facet joint syndrome.',
 facts:['Thoracic facets lie in a near-coronal plane, favoring rotation over flexion/extension','Innervated by medial branches of the dorsal rami from two adjacent levels','Paired at each vertebral level'],
 jointType:'Synovial, plane (gliding) joint', articulations:'Inferior articular process of the vertebra above with superior articular process of the vertebra below',
 movements:['Gliding movement contributing to rotation','Limited flexion/extension in the thoracic region'],
 supportingLigaments:['Joint capsule','Ligamentum flavum (indirectly)']},

{id:'w1-ivd',name:'Intervertebral Disc',category:'Joint',week:1,region:'Vertebral column',wiki:'Intervertebral disc',
 description:'Fibrocartilaginous cushion between adjacent vertebral bodies composed of an outer anulus fibrosus and inner nucleus pulposus.',
 clinical:'Herniation of the nucleus pulposus through a weakened anulus (usually posterolaterally) can compress adjacent spinal nerve roots, causing radiculopathy.',
 facts:['Acts as a shock absorber, permits limited movement between vertebrae','Anulus fibrosus is made of concentric lamellae of type I collagen','Avascular in adults, nourished by diffusion — prone to degeneration'],
 jointType:'Secondary cartilaginous joint (symphysis)', articulations:'Between the bodies of two adjacent vertebrae',
 movements:['Small gliding/compressive movements that sum to overall spinal flexibility'],
 supportingLigaments:['Anterior longitudinal ligament','Posterior longitudinal ligament']},

{id:'w1-costotransverse-joint',name:'Costotransverse Joint',category:'Joint',week:1,region:'Thoracic spine',wiki:'Costotransverse joint',
 description:'Synovial joint between the articular facet on the tubercle of a rib and the transverse costal facet of the corresponding vertebra.',
 clinical:'Present only at T1-T10 (absent at T11-T12); degeneration here contributes to costovertebral joint pain and restricted rib excursion during breathing.',
 facts:['Works with the costovertebral joint as a functional unit allowing rib elevation/depression','Reinforced by the costotransverse and lateral costotransverse ligaments','Joint shape changes the axis of rib rotation along the thoracic cage'],
 jointType:'Synovial, plane joint', articulations:'Tubercle of rib with the transverse process of the corresponding vertebra',
 movements:['Gliding rotation of the rib neck, contributing to rib elevation during inspiration'],
 supportingLigaments:['Costotransverse ligament','Superior costotransverse ligament','Lateral costotransverse ligament']},

{id:'w1-costovertebral-joint',name:'Costovertebral Joint',category:'Joint',week:1,region:'Thoracic spine',wiki:'Costovertebral joint',
 description:'Synovial joint between the head of a typical rib and the demi-facets of two adjacent vertebral bodies plus the intervening disc.',
 clinical:'The intra-articular ligament of the head of rib divides the joint into two synovial cavities; dysfunction is a recognized cause of thoracic back pain.',
 facts:['Ribs 1, 10, 11, 12 articulate with only one vertebral body (single facet, no dividing ligament)','Stabilized anteriorly by the radiate ligament','Works with the costotransverse joint to allow rib movements of breathing'],
 jointType:'Synovial, plane joint', articulations:'Head of rib with demi-facets of two adjacent vertebral bodies and the intervening disc',
 movements:['Slight gliding allowing rib elevation/depression during respiration'],
 supportingLigaments:['Radiate ligament','Intra-articular ligament of the head of rib']},

{id:'w1-costochondral-joint',name:'Costochondral Joint',category:'Joint',week:1,region:'Rib',wiki:'Costochondral joint',
 description:'Junction between the bony rib shaft and its costal cartilage, forming a primary cartilaginous joint (synchondrosis).',
 clinical:'Costochondritis (inflammation at this junction, most often ribs 2-5) is a common cause of reproducible, sharp anterior chest wall pain that mimics cardiac pain.',
 facts:['No joint capsule or synovial cavity — periosteum is continuous with perichondrium','Immobile joint; cartilage elasticity lets the rib bend slightly with respiration','Present bilaterally on every rib'],
 jointType:'Primary cartilaginous joint (synchondrosis)', articulations:'Bony rib with its own costal cartilage',
 movements:['Essentially none — provides elastic flexibility rather than true movement'],
 supportingLigaments:['None — continuous periosteum/perichondrium provides stability']},

{id:'w1-sternocostal-joint',name:'Sternocostal Joint',category:'Joint',week:1,region:'Sternum',wiki:'Sternocostal joint',
 description:'Joint between the costal cartilages of ribs 1-7 and the lateral border of the sternum.',
 clinical:'Rib 1\'s joint is a synchondrosis, often a site of pain in costochondritis/Tietze syndrome (rib 2); joints 2-7 are synovial and more mobile.',
 facts:['Joint of rib 1 is a synchondrosis (immobile)','Joints of ribs 2-7 are synovial plane joints reinforced by radiate ligaments','Allows slight gliding that increases thoracic AP diameter during inspiration'],
 jointType:'Rib 1: primary cartilaginous (synchondrosis); Ribs 2-7: synovial plane joints', articulations:'Costal cartilage of ribs 1-7 with the sternum',
 movements:['Minimal gliding of ribs 2-7 aiding thoracic expansion; none at rib 1'],
 supportingLigaments:['Radiate sternocostal ligaments','Intra-articular sternocostal ligament (rib 2)']},

{id:'w1-sternoclavicular-joint',name:'Sternoclavicular Joint',category:'Joint',week:1,region:'Sternum/clavicle',wiki:'Sternoclavicular joint',
 description:'Saddle-shaped synovial joint between the medial end of the clavicle, the clavicular notch of the manubrium, and the cartilage of rib 1.',
 clinical:'The only true joint connecting the upper limb to the axial skeleton; posterior dislocation is a surgical emergency due to proximity to the great vessels/trachea.',
 facts:['Contains an intra-articular fibrocartilaginous disc dividing the joint into two compartments','Functions as a ball-and-socket joint despite its saddle shape, due to the disc','Stabilized by costoclavicular, interclavicular, and sternoclavicular ligaments'],
 jointType:'Synovial, saddle joint (functions as ball-and-socket)', articulations:'Sternal end of clavicle, clavicular notch of manubrium, and first costal cartilage',
 movements:['Elevation/depression, protraction/retraction, and rotation of the clavicle'],
 supportingLigaments:['Anterior/posterior sternoclavicular ligaments','Costoclavicular ligament','Interclavicular ligament']},

{id:'w1-manubriosternal-joint',name:'Manubriosternal Joint',category:'Joint',week:1,region:'Sternum',wiki:'Manubriosternal joint',
 description:'Secondary cartilaginous joint (symphysis) between the manubrium and body of the sternum, marked externally by the sternal angle.',
 clinical:'The sternal angle (angle of Louis) here is a key surface landmark: level with the 2nd costal cartilage, T4/T5 disc, tracheal bifurcation, and aortic arch boundaries.',
 facts:['Usually remains slightly mobile throughout life, allowing slight movement during deep breathing','Can ossify in older age','Palpable as a horizontal ridge below the jugular notch'],
 jointType:'Secondary cartilaginous joint (symphysis)', articulations:'Manubrium with the body of the sternum',
 movements:['Minimal angular movement permitting slight thoracic expansion'],
 supportingLigaments:['Fibrocartilage disc','Ligamentous fibers continuous with periosteum']},

{id:'w1-ligamentum-flavum',name:'Ligamentum Flavum',category:'Ligament',week:1,region:'Vertebral column',wiki:'Ligamentum flavum',
 description:'Paired elastic ligament connecting the laminae of adjacent vertebrae, running from C2 to S1.',
 clinical:'Its high elastin content gives it a yellow color; it is the ligament pierced (often felt as "loss of resistance") during epidural anesthesia.',
 facts:['Most elastic ligament in the body (~80% elastin)','Hypertrophy contributes to spinal stenosis','Lies just anterior to the lamina, forming part of the posterior wall of the vertebral canal'],
 ligAttachments:['Anteroinferior surface of the lamina above','Posterosuperior surface/upper border of the lamina below'],
 ligFunction:'Limits excessive flexion of the vertebral column and helps restore upright posture after flexion by recoiling elastically'},

{id:'w1-pll',name:'Posterior Longitudinal Ligament',category:'Ligament',week:1,region:'Vertebral column',wiki:'Posterior longitudinal ligament',
 description:'Narrow ligament running along the posterior surface of the vertebral bodies within the vertebral canal, from C2 to the sacrum.',
 clinical:'Weaker and narrower than the ALL, especially laterally, making it a relatively poor barrier to posterolateral disc herniation — the most common herniation direction.',
 facts:['Lies within the vertebral canal, anterior to the spinal cord/dura','Broader over the discs, narrower over the vertebral bodies','Continuous superiorly with the tectorial membrane'],
 ligAttachments:['Posterior aspect of vertebral bodies and intervertebral discs, C2 to sacrum'],
 ligFunction:'Resists hyperflexion of the vertebral column and helps limit (though incompletely) posterior disc herniation'},

{id:'w1-all',name:'Anterior Longitudinal Ligament',category:'Ligament',week:1,region:'Vertebral column',wiki:'Anterior longitudinal ligament',
 description:'Broad, strong ligament running along the anterior surface of the vertebral bodies from the skull base to the sacrum.',
 clinical:'The strongest spinal ligament; can ossify extensively in diffuse idiopathic skeletal hyperostosis (DISH), and rupture is associated with hyperextension injuries (e.g. whiplash).',
 facts:['Firmly attached to vertebral bodies and discs, more loosely spanning the concave body surfaces','Widest and thickest in the thoracic region','Prevents hyperextension of the spine'],
 ligAttachments:['Anterior surface of vertebral bodies and intervertebral discs, from occiput/C1 to sacrum'],
 ligFunction:'Limits hyperextension and reinforces the anterior anulus fibrosus of the intervertebral discs'},

{id:'w1-intertransverse-lig',name:'Intertransverse Ligament',category:'Ligament',week:1,region:'Vertebral column',wiki:'Intertransverse ligament',
 description:'Thin ligament (often more membranous/muscular in the thoracic region) connecting adjacent transverse processes.',
 clinical:'In the thoracic region it blends with the intertransverse muscles and is less discrete than in the lumbar spine, a point often tested when comparing regional ligament anatomy.',
 facts:['Better developed as a discrete ligament in the lumbar region','Helps limit lateral flexion of the vertebral column to the opposite side','Located between adjacent transverse processes'],
 ligAttachments:['Adjacent transverse processes of neighboring vertebrae'],
 ligFunction:'Limits contralateral lateral flexion of the vertebral column'},

{id:'w1-supraspinous-lig',name:'Supraspinous Ligament',category:'Ligament',week:1,region:'Vertebral column',wiki:'Supraspinous ligament',
 description:'Strong fibrous cord connecting the tips of the spinous processes from C7 to the sacrum.',
 clinical:'Continuous superiorly with the ligamentum nuchae in the cervical region; injury contributes to interspinous instability and can be a pain generator in mechanical low back pain.',
 facts:['Runs superficial to the interspinous ligament','Limits flexion of the vertebral column','Often the first ligament encountered/palpated in the midline posterior back'],
 ligAttachments:['Tips of spinous processes from C7 to sacrum'],
 ligFunction:'Resists excessive flexion (forward bending) of the vertebral column'},

{id:'w1-interspinous-lig',name:'Interspinous Ligament',category:'Ligament',week:1,region:'Vertebral column',wiki:'Interspinous ligament',
 description:'Thin ligament connecting adjacent spinous processes, lying between the supraspinous ligament posteriorly and ligamentum flavum anteriorly.',
 clinical:'Provides posterior tension-band support against flexion together with the supraspinous ligament and ligamentum flavum; disruption is associated with spondylolisthesis and flexion-distraction injuries.',
 facts:['Weakest of the posterior spinal ligaments','Best developed in the lumbar region','Connects the root to the apex of each spinous process'],
 ligAttachments:['Adjoining margins of adjacent spinous processes'],
 ligFunction:'Limits flexion of the vertebral column, working with the supraspinous ligament and ligamentum flavum'},

{id:'w1-radiate-lig',name:'Radiate Ligament',category:'Ligament',week:1,region:'Costovertebral joint',wiki:'Radiate ligament of head of rib',
 description:'Fan-shaped ligament on the anterior aspect of the head of the rib that radiates to attach to the bodies of two adjacent vertebrae and the intervening disc.',
 clinical:'Provides the primary anterior stability to the costovertebral joint; its three-band fan pattern helps distinguish typical from atypical rib attachments (ribs 1, 10-12 attach to a single vertebra only).',
 facts:['Has three bands — to the vertebra above, the disc, and the vertebra below (in typical ribs)','Blends with the anterior longitudinal ligament','Reinforces the costovertebral joint anteriorly'],
 ligAttachments:['Head of rib to the bodies of the two adjacent vertebrae and the intervertebral disc between them'],
 ligFunction:'Stabilizes and reinforces the costovertebral joint, limiting excessive rib head movement'},

{id:'w1-costotransverse-lig',name:'Costotransverse Ligament',category:'Ligament',week:1,region:'Costotransverse joint',wiki:'Costotransverse ligament',
 description:'Short, strong ligament connecting the posterior surface of the neck of the rib to the anterior surface of the corresponding transverse process.',
 clinical:'Together with the lateral and superior costotransverse ligaments, stabilizes the costotransverse joint and limits excessive rib excursion.',
 facts:['Fills the costotransverse foramen between the rib neck and transverse process','Distinct from the lateral costotransverse ligament (tubercle to transverse process tip) and superior costotransverse ligament (neck to transverse process above)','Absent at T11-T12 where there is no costotransverse joint'],
 ligAttachments:['Neck of rib to the transverse process of the same vertebra'],
 ligFunction:'Stabilizes the costotransverse joint and limits rib gliding movement'},
{id:'w1-iliocostalis',name:'Iliocostalis',category:'Muscle',week:1,region:'Erector spinae, back',wiki:'Iliocostalis',
 description:'Most lateral column of the erector spinae, subdivided into lumborum, thoracis, and cervicis parts running from the pelvis to ribs/cervical transverse processes.',
 clinical:'Overuse or strain of the iliocostalis is a common cause of mechanical lower back and thoracic pain in athletes performing repetitive extension/rotation.',
 facts:['Most lateral of the three erector spinae columns (lateral to longissimus and spinalis)','Historically part of "sacrospinalis"','Spans lumbar to cervical regions in overlapping segments'],
 origin:['Sacrum','Iliac crest','Posterior ribs (overlapping segmental attachments)'],
 insertion:['Angles of ribs','Transverse processes of lower cervical vertebrae'],
 action:['Bilateral: extension of the vertebral column','Unilateral: lateral flexion of the vertebral column'],
 innervation:'Dorsal rami of spinal nerves', bloodSupply:'Dorsal branches of posterior intercostal and lumbar arteries'},

{id:'w1-longissimus',name:'Longissimus',category:'Muscle',week:1,region:'Erector spinae, back',wiki:'Longissimus',
 description:'Intermediate and longest column of the erector spinae, extending from the sacrum/lumbar vertebrae to the mastoid process, subdivided into thoracis, cervicis, and capitis parts.',
 clinical:'Longissimus capitis and cervicis extend/rotate the head and neck; whiplash injuries frequently strain these upper fibers.',
 facts:['Longissimus capitis inserts on the mastoid process, rotating/extending the head','Intermediate column between iliocostalis (lateral) and spinalis (medial)','Longest of the three erector spinae columns'],
 origin:['Transverse processes of thoracic and lumbar vertebrae','Sacrum'],
 insertion:['Transverse processes of vertebrae above','Ribs','Mastoid process (capitis part)'],
 action:['Bilateral: extension of the vertebral column and head','Unilateral: lateral flexion; head rotation to the same side (capitis)'],
 innervation:'Dorsal rami of spinal nerves', bloodSupply:'Dorsal branches of posterior intercostal and lumbar arteries'},

{id:'w1-spinalis',name:'Spinalis',category:'Muscle',week:1,region:'Erector spinae, back',wiki:'Spinalis',
 description:'Most medial and smallest column of the erector spinae, lying adjacent to the spinous processes, subdivided into thoracis, cervicis, and capitis parts.',
 clinical:'Often poorly defined or fused with adjacent multifidus/semispinalis fibers in dissection, a common source of confusion identifying the three erector spinae columns.',
 facts:['Most medial erector spinae column, directly lateral to the spinous processes','Least developed of the three columns','Spinalis thoracis is the most consistently present part'],
 origin:['Spinous processes of upper lumbar and lower thoracic vertebrae'],
 insertion:['Spinous processes of upper thoracic vertebrae'],
 action:['Bilateral: extension of the vertebral column','Unilateral: minor lateral flexion'],
 innervation:'Dorsal rami of spinal nerves', bloodSupply:'Dorsal branches of posterior intercostal arteries'},

{id:'w1-multifidus',name:'Multifidus',category:'Muscle',week:1,region:'Transversospinalis group, back',wiki:'Multifidus muscle',
 description:'Deep segmental muscle of the transversospinalis group spanning 2-4 vertebral levels, running obliquely from transverse processes to spinous processes above, thickest in the lumbar region.',
 clinical:'Atrophy of the multifidus is strongly associated with chronic low back pain and is a key target of spinal stabilization/core rehabilitation exercises.',
 facts:['Deepest and most medial of the transversospinalis group','Provides segmental stabilization and proprioceptive feedback for the spine','Best developed in the lumbar spine'],
 origin:['Sacrum','Posterior superior iliac spine','Mammillary processes (lumbar)','Transverse processes (thoracic)','Articular processes (cervical)'],
 insertion:['Spinous process of the vertebra 2-4 levels above the origin'],
 action:['Bilateral: extension of the vertebral column','Unilateral: contralateral rotation and ipsilateral lateral flexion; segmental stabilization'],
 innervation:'Dorsal rami of spinal nerves', bloodSupply:'Dorsal branches of segmental spinal arteries'},

{id:'w1-trapezius',name:'Trapezius',category:'Muscle',week:1,region:'Superficial back',wiki:'Trapezius',
 description:'Large superficial triangular muscle spanning the occiput to T12, divided functionally into descending, transverse, and ascending fibers that control scapular position.',
 clinical:'The spinal accessory nerve (CN XI) is the sole motor supply and is vulnerable during posterior triangle lymph node biopsy, producing shoulder drop and scapular winging if injured.',
 facts:['Only muscle innervated purely by CN XI for motor function (C3-C4 carry proprioception)','Upper fibers elevate scapula, middle retract it, lower depress it','Forms the roof of the posterior triangle of the neck'],
 origin:['External occipital protuberance','Nuchal ligament','Spinous processes of C7-T12'],
 insertion:['Lateral third of clavicle','Acromion','Spine of scapula'],
 action:['Upper fibers: elevate scapula','Middle fibers: retract scapula','Lower fibers: depress scapula','All fibers: upward rotation of scapula for arm abduction above horizontal'],
 innervation:'Spinal accessory nerve (CN XI) motor; C3-C4 ventral rami for pain/proprioception', bloodSupply:'Transverse cervical artery'},

{id:'w1-lat-dorsi',name:'Latissimus Dorsi',category:'Muscle',week:1,region:'Superficial back',wiki:'Latissimus dorsi',
 description:'Broad, flat, fan-shaped muscle covering the lower back that converges to insert on the humerus, forming the posterior wall of the axilla.',
 clinical:'Can be used as a pedicled or free myocutaneous flap in breast reconstruction because of its reliable thoracodorsal neurovascular pedicle.',
 facts:['Forms the posterior axillary fold','Adducts, extends, and internally rotates the humerus — the "swimmer\'s muscle"','Its tendon twists 180° before inserting into the intertubercular groove'],
 origin:['Spinous processes of T7-L5','Thoracolumbar fascia','Iliac crest','Lower 3-4 ribs','Inferior angle of scapula'],
 insertion:['Floor of the intertubercular (bicipital) groove of the humerus'],
 action:['Extension, adduction, and medial (internal) rotation of the shoulder joint'],
 innervation:'Thoracodorsal nerve (C6-C8)', bloodSupply:'Thoracodorsal artery'},

{id:'w1-serratus-anterior',name:'Serratus Anterior',category:'Muscle',week:1,region:'Lateral thoracic wall',wiki:'Serratus anterior muscle',
 description:'Fan-shaped muscle with finger-like digitations arising from the upper 8-9 ribs and wrapping around the thorax to insert on the medial border of the scapula.',
 clinical:'Long thoracic nerve injury (e.g. during axillary lymph node dissection) paralyzes serratus anterior, producing a classic "winged scapula."',
 facts:['Only scapular muscle innervated by the long thoracic nerve','Holds the scapula against the thoracic wall and enables upward rotation for full arm abduction','Lower fibers are the strongest protractors of the scapula'],
 origin:['External surfaces of ribs 1-8 (or 9)'],
 insertion:['Anterior (costal) surface of the medial border of the scapula'],
 action:['Protraction (protrusion) and upward rotation of the scapula; holds scapula against the thoracic wall'],
 innervation:'Long thoracic nerve (C5-C7)', bloodSupply:'Lateral thoracic artery, thoracodorsal artery'},

{id:'w1-serratus-post-sup',name:'Serratus Posterior Superior',category:'Muscle',week:1,region:'Deep back, thoracic wall',wiki:'Serratus posterior superior muscle',
 description:'Thin quadrilateral muscle deep to the rhomboids running from the lower cervical/upper thoracic spinous processes to ribs 2-5.',
 clinical:'Classified as a respiratory accessory muscle, though its true mechanical contribution to rib elevation during quiet breathing is debated/minor.',
 facts:['Lies deep to rhomboid major/minor','Some sources suggest a primarily proprioceptive rather than powerful respiratory role','Elevates ribs 2-5'],
 origin:['Ligamentum nuchae','Spinous processes of C7-T3'],
 insertion:['Superior borders of ribs 2-5, lateral to their angles'],
 action:['Elevates ribs 2-5, assisting inspiration'],
 innervation:'Anterior rami of upper thoracic spinal nerves (T2-T5)', bloodSupply:'Posterior intercostal arteries'},

{id:'w1-serratus-post-inf',name:'Serratus Posterior Inferior',category:'Muscle',week:1,region:'Deep back, thoracolumbar junction',wiki:'Serratus posterior inferior muscle',
 description:'Thin quadrilateral muscle deep to latissimus dorsi running from the lower thoracic/upper lumbar spinous processes to the lower 4 ribs.',
 clinical:'Considered an accessory expiratory muscle by depressing the lower ribs, opposing the diaphragm during forced expiration.',
 facts:['Lies deep to latissimus dorsi','Fibers run opposite direction to serratus posterior superior','Depresses ribs 9-12'],
 origin:['Spinous processes of T11-L2','Thoracolumbar fascia'],
 insertion:['Inferior borders of ribs 9-12'],
 action:['Depresses ribs 9-12, assisting forced expiration'],
 innervation:'Anterior rami of lower thoracic spinal nerves (T9-T12)', bloodSupply:'Posterior intercostal and subcostal arteries'},

{id:'w1-ext-intercostals',name:'External Intercostals',category:'Muscle',week:1,region:'Thoracic wall',wiki:'External intercostal muscles',
 description:'Outermost of the three intercostal muscle layers, fibers running obliquely downward and medially ("hands in pockets") from rib above to rib below.',
 clinical:'Along with the internal intercostals, elevated with periosteum during a thoracotomy to preserve the intercostal neurovascular bundle.',
 facts:['Fibers run inferomedially, opposite to internal intercostals','Membranous anteriorly (external intercostal membrane) from costal cartilage to sternum','Elevate ribs during inspiration'],
 origin:['Inferior border of the rib above'],
 insertion:['Superior border of the rib below'],
 action:['Elevate the ribs during inspiration, increasing thoracic volume'],
 innervation:'Intercostal nerves (anterior rami of T1-T11)', bloodSupply:'Posterior and anterior intercostal arteries'},

{id:'w1-int-intercostals',name:'Internal Intercostals',category:'Muscle',week:1,region:'Thoracic wall',wiki:'Internal intercostal muscles',
 description:'Middle layer of intercostal muscles, deep to the external intercostals, fibers running obliquely in the opposite direction (superomedial to inferolateral, "hands out of pockets").',
 clinical:'Considered the primary muscles of forced expiration by depressing the ribs, important in coughing and heavy exertion.',
 facts:['Fibers run perpendicular to external intercostals','Membranous posteriorly (internal intercostal membrane) near the rib angles','Depress ribs, aiding forced expiration'],
 origin:['Superior border of the rib below (and costal cartilage medially)'],
 insertion:['Inferior border of the rib above'],
 action:['Depress the ribs during forced expiration; interchondral part may assist elevation anteriorly'],
 innervation:'Intercostal nerves (anterior rami of T1-T11)', bloodSupply:'Posterior and anterior intercostal arteries'},

{id:'w1-innermost-intercostals',name:'Innermost Intercostals',category:'Muscle',week:1,region:'Thoracic wall',wiki:'Innermost intercostal muscles',
 description:'Deepest of the three intercostal layers, separated from the internal intercostals by the intercostal neurovascular bundle, present mainly in the mid-thoracic wall.',
 clinical:'Its plane, together with the internal intercostal plane, is the surgical plane exploited in intercostal nerve blocks and thoracic paravertebral blocks.',
 facts:['Fibers run parallel to internal intercostals','Neurovascular bundle lies between innermost and internal intercostal layers','Less complete/consistent than the other two intercostal layers'],
 origin:['Internal surface of the rib below, near the costal groove'],
 insertion:['Internal surface of the rib above'],
 action:['Assist depression of ribs during forced expiration, working with internal intercostals'],
 innervation:'Intercostal nerves (anterior rami of T1-T11)', bloodSupply:'Posterior and anterior intercostal arteries'},

{id:'w1-levatores-costarum',name:'Levatores Costarum',category:'Muscle',week:1,region:'Deep back, thoracic wall',wiki:'Levatores costarum',
 description:'Small fan-shaped muscles arising from the transverse processes of C7-T11 and inserting on the rib below, deep to the erector spinae.',
 clinical:'Functionally similar to external intercostals as inspiratory accessory muscles; the "longus" variant spans two ribs rather than one.',
 facts:['12 pairs, one for each thoracic vertebra transverse process','"Brevis" fibers insert on the rib immediately below, "longus" fibers skip a rib','Assist rib elevation and may slightly contribute to vertebral rotation/lateral flexion'],
 origin:['Transverse processes of C7 and T1-T11'],
 insertion:['Rib immediately below (brevis) or one rib further (longus), near the tubercle'],
 action:['Elevate ribs, assisting inspiration; slight lateral flexion/rotation of the vertebral column'],
 innervation:'Dorsal rami of thoracic spinal nerves (C8-T11)', bloodSupply:'Posterior intercostal arteries'},

{id:'w1-pec-major',name:'Pectoralis Major',category:'Muscle',week:1,region:'Anterior chest wall',wiki:'Pectoralis major',
 description:'Large fan-shaped superficial muscle of the anterior chest with clavicular and sternocostal heads, forming the anterior axillary fold.',
 clinical:'Rupture of the pectoralis major tendon (classically in weightlifters during bench press) causes a palpable defect and ecchymosis.',
 facts:['Clavicular head flexes the shoulder; sternocostal head extends it from a flexed position','Forms the anterior axillary fold','Tendon inserts with a distinctive bilaminar twist onto the lateral lip of the intertubercular groove'],
 origin:['Clavicular head: medial half of clavicle','Sternocostal head: sternum, upper 6 costal cartilages, external oblique aponeurosis'],
 insertion:['Lateral lip of the intertubercular groove of the humerus'],
 action:['Adduction and medial rotation of the shoulder; clavicular head flexes the shoulder; sternocostal head extends the flexed shoulder back to neutral'],
 innervation:'Medial and lateral pectoral nerves (C5-T1)', bloodSupply:'Pectoral branch of the thoracoacromial artery'},

{id:'w1-pec-minor',name:'Pectoralis Minor',category:'Muscle',week:1,region:'Anterior chest wall',wiki:'Pectoralis minor',
 description:'Small triangular muscle deep to pectoralis major, running from ribs 3-5 to the coracoid process of the scapula.',
 clinical:'Used as a surgical landmark dividing the axillary artery into three parts; a tight pectoralis minor is implicated in neurogenic thoracic outlet syndrome.',
 facts:['Deep to pectoralis major','Stabilizes the scapula against the thoracic wall and depresses/protracts it','Divides the axillary artery into 3 parts as a landmark'],
 origin:['Ribs 3-5, near their costal cartilages'],
 insertion:['Coracoid process of the scapula'],
 action:['Depresses and protracts the scapula, stabilizes it against the thoracic wall; accessory muscle of inspiration when the scapula is fixed'],
 innervation:'Medial pectoral nerve (C8-T1)', bloodSupply:'Pectoral branch of the thoracoacromial artery'},

{id:'w1-subclavius',name:'Subclavius',category:'Muscle',week:1,region:'Anterior chest wall',wiki:'Subclavius muscle',
 description:'Small muscle running from the first rib to the inferior surface of the clavicle, deep to pectoralis major.',
 clinical:'Its tendon cushions the underlying subclavian vessels/brachial plexus from clavicle fractures and is a surgical landmark protecting the neurovascular bundle.',
 facts:['Smallest muscle attaching to the clavicle','Anchors and depresses the clavicle, stabilizing the sternoclavicular joint','Lies within the clavipectoral fascia deep to pectoralis major'],
 origin:['First rib and its costal cartilage'],
 insertion:['Inferior surface of the middle third of the clavicle'],
 action:['Depresses and stabilizes the clavicle, slightly draws it toward the sternum'],
 innervation:'Nerve to subclavius (C5-C6)', bloodSupply:'Clavicular branch of the thoracoacromial artery'},

{id:'w1-diaphragm',name:'Diaphragm',category:'Muscle',week:1,region:'Thoracoabdominal boundary',wiki:'Thoracic diaphragm',
 description:'Dome-shaped musculotendinous sheet separating the thoracic and abdominal cavities, with a central tendon and peripheral muscular attachments from sternum, ribs, and lumbar vertebrae.',
 clinical:'Phrenic nerve injury causes diaphragmatic paralysis and paradoxical upward movement on sniffing (positive sniff test); referred diaphragmatic irritation pain is felt at the shoulder tip (C3-C5 dermatome).',
 facts:['Pierced by three major openings — caval opening at T8, esophageal hiatus at T10, aortic hiatus at T12 ("I ate ten eggs at twelve")','Sole motor and most sensory supply from the phrenic nerve (C3-C5)','Principal muscle of quiet inspiration, responsible for ~75% of tidal volume'],
 origin:['Xiphoid process','Costal cartilages of ribs 7-12','Lumbar vertebrae (via crura) and arcuate ligaments'],
 insertion:['Central tendon'],
 action:['Contracts and flattens to increase thoracic volume for inspiration; primary muscle of quiet breathing'],
 innervation:'Phrenic nerve (C3-C5) motor and most sensory; peripheral costal part also sensory via lower intercostal nerves', bloodSupply:'Musculophrenic and pericardiacophrenic arteries, superior/inferior phrenic arteries'},
{id:'w1-intercostal-nerve',name:'Intercostal Nerve',category:'Nerve',week:1,region:'Thoracic wall',wiki:'Intercostal nerve',
 description:'Anterior ramus of a thoracic spinal nerve (T1-T11) running in the costal groove between the internal and innermost intercostal muscles, supplying the thoracic and abdominal wall.',
 clinical:'Post-thoracotomy pain or shingles (herpes zoster) reactivation along a single dermatome causes intercostal neuralgia; intercostal nerve blocks are used for rib fracture analgesia.',
 facts:['Runs below the intercostal vein and artery in the costal groove (VAN superior to inferior)','T7-T11 continue as thoracoabdominal nerves supplying the anterior abdominal wall','T12 is called the subcostal nerve'],
 roots:'Anterior (ventral) rami of T1-T11',
 course:'Passes laterally in the costal groove between internal and innermost intercostal muscles, giving off a lateral cutaneous branch at the midaxillary line and terminating as an anterior cutaneous branch near the sternum',
 motorSupply:'Intercostal muscles, levatores costarum, serratus posterior, and (for lower nerves) anterior abdominal wall muscles',
 sensorySupply:'Skin and parietal pleura/peritoneum of the corresponding dermatome',
 branches:['Collateral branch','Lateral cutaneous branch','Anterior cutaneous branch','Muscular branches']},

{id:'w1-sympathetic-trunk',name:'Sympathetic Trunk',category:'Nerve',week:1,region:'Paravertebral, thoracic',wiki:'Sympathetic trunk',
 description:'Paired chain of interconnected sympathetic ganglia running vertically along the vertebral column from the skull base to the coccyx, lying just anterior to the rib heads in the thorax.',
 clinical:'Surgical or chemical thoracic sympathectomy (e.g. for hyperhidrosis) targets this chain; Horner syndrome results from disruption of the cervical sympathetic supply arising from T1.',
 facts:['Thoracic portion has 11-12 ganglia, one per segment','Gives rise to the greater (T5-T9), lesser (T10-T11), and least (T12) splanchnic nerves','Receives white rami communicantes and sends gray rami communicantes to every spinal nerve'],
 roots:'Preganglionic sympathetic fibers from the lateral horn of spinal cord segments T1-L2',
 course:'Runs longitudinally along the heads of the ribs/vertebral bodies within the posterior mediastinum, continuous with the cervical and pelvic sympathetic chains',
 motorSupply:'Not applicable — autonomic pathway to smooth muscle/glands, not skeletal muscle',
 sensorySupply:'Visceral afferents travel alongside sympathetic fibers but the trunk is primarily a motor/visceral efferent pathway',
 branches:['Gray and white rami communicantes','Greater/lesser/least splanchnic nerves','Cardiopulmonary branches']},

{id:'w1-spinal-nerve',name:'Spinal Nerve Structures',category:'Nerve',week:1,region:'Intervertebral foramen',wiki:'Spinal nerve',
 description:'Mixed nerve formed by the union of a dorsal (sensory) root and ventral (motor) root, which then divides just outside the intervertebral foramen into dorsal and ventral rami.',
 clinical:'Herniated discs or foraminal stenosis compress the nerve root here, causing radicular pain, sensory loss, and weakness in the corresponding dermatome/myotome.',
 facts:['Dorsal root ganglion (sensory neuron cell bodies) lies within or just lateral to the intervertebral foramen','Dorsal ramus supplies deep back muscles and skin','Ventral ramus supplies the limbs and anterolateral trunk and is much larger, forming plexuses'],
 roots:'Dorsal (sensory) root and ventral (motor) root uniting within the intervertebral foramen',
 course:'Very short trunk within the intervertebral foramen before dividing into dorsal and ventral rami just outside the foramen',
 motorSupply:'Ventral root fibers to skeletal muscle, distributed via dorsal and ventral rami',
 sensorySupply:'Dorsal root fibers carrying sensation from the corresponding dermatome',
 branches:['Dorsal ramus','Ventral ramus','Meningeal (recurrent) branch','Rami communicantes']},

{id:'w1-ascending-aorta',name:'Ascending Aorta',category:'Artery',week:1,region:'Mediastinum',wiki:'Ascending aorta',
 description:'First and shortest segment of the aorta, arising from the left ventricle and giving rise to the coronary arteries before becoming the aortic arch.',
 clinical:'Site of Stanford type A aortic dissection, a life-threatening emergency requiring emergency surgery; also the site of aortic root aneurysms in Marfan syndrome.',
 facts:['Approximately 5cm long, begins at the aortic valve','Contains the aortic sinuses (of Valsalva) from which the coronary arteries arise','Lies within the pericardial sac'],
 arteryOrigin:'Left ventricle, at the aortic valve', arteryBranches:['Right coronary artery','Left coronary artery'], areasSupplied:'Heart (via the coronary arteries)'},

{id:'w1-descending-aorta',name:'Descending Aorta',category:'Artery',week:1,region:'Posterior mediastinum/abdomen',wiki:'Descending aorta',
 description:'Continuation of the aorta after the arch, subdivided into thoracic (to T12) and abdominal (below diaphragm) portions, running just left of the vertebral column.',
 clinical:'A common site for atherosclerotic aneurysm formation, particularly the abdominal portion; the thoracic portion can be affected by traumatic aortic injury in rapid deceleration.',
 facts:['Thoracic part lies in the posterior mediastinum','Passes through the aortic hiatus of the diaphragm at T12 to become the abdominal aorta','Gives off posterior intercostal arteries in the thorax'],
 arteryOrigin:'Continuation of the aortic arch at the level of T4', arteryBranches:['Posterior intercostal arteries','Subcostal artery','Bronchial, esophageal and pericardial branches (thoracic)'], areasSupplied:'Thoracic wall, esophagus, bronchi, pericardium'},

{id:'w1-aortic-arch',name:'Aortic Arch',category:'Artery',week:1,region:'Superior mediastinum',wiki:'Aortic arch',
 description:'Curved segment of the aorta connecting the ascending aorta to the descending aorta, arching over the left pulmonary artery/left main bronchus and giving off the three great vessels of the neck/upper limb.',
 clinical:'Contains baroreceptors in the aortic bodies regulating blood pressure; site of coarctation of the aorta, typically just distal to the left subclavian origin near the ligamentum arteriosum.',
 facts:['Gives rise, in order, to the brachiocephalic trunk, left common carotid artery, and left subclavian artery','Lies posterior to the manubrium','The ligamentum arteriosum (fetal ductus arteriosus remnant) attaches to its inferior aspect'],
 arteryOrigin:'Continuation of the ascending aorta', arteryBranches:['Brachiocephalic trunk','Left common carotid artery','Left subclavian artery'], areasSupplied:'Head, neck, and upper limbs (via its three branches)'},

{id:'w1-coronary-arteries',name:'Coronary Arteries',category:'Artery',week:1,region:'Heart',wiki:'Coronary circulation',
 description:'Right and left coronary arteries arising from the aortic sinuses just above the aortic valve, supplying the myocardium.',
 clinical:'Atherosclerotic occlusion is the cause of coronary artery disease/myocardial infarction; the right coronary artery typically supplies the SA and AV nodes (right-dominant circulation).',
 facts:['Left coronary artery divides into the left anterior descending (LAD) and circumflex branches','Right coronary artery typically supplies the SA node (~60%) and AV node (~80-90%)','Fill primarily during diastole due to aortic valve cusp movement during systole'],
 arteryOrigin:'Aortic sinuses of the ascending aorta, just superior to the aortic valve cusps', arteryBranches:['Left coronary artery → LAD and circumflex arteries','Right coronary artery → right marginal and (usually) posterior interventricular artery'], areasSupplied:'Myocardium of all four heart chambers and the cardiac conduction system'},

{id:'w1-brachiocephalic-trunk',name:'Brachiocephalic Trunk',category:'Artery',week:1,region:'Superior mediastinum',wiki:'Brachiocephalic artery',
 description:'First and largest branch of the aortic arch, arising posterior to the manubrium and dividing into the right common carotid and right subclavian arteries.',
 clinical:'The only "trunk" branch of the arch — an important right/left asymmetry, since the left carotid and subclavian arise directly from the arch.',
 facts:['Has no named branches other than its two terminal divisions','Lies anterior to the trachea','Divides at the level of the right sternoclavicular joint'],
 arteryOrigin:'Aortic arch (first and rightmost branch)', arteryBranches:['Right common carotid artery','Right subclavian artery'], areasSupplied:'Right side of the head, neck, and upper limb'},

{id:'w1-left-subclavian',name:'Left Subclavian Artery',category:'Artery',week:1,region:'Superior mediastinum/neck',wiki:'Subclavian artery',
 description:'Third branch of the aortic arch, arising directly from the arch and arching over the apex of the left lung to become the axillary artery at the outer border of rib 1.',
 clinical:'Site of blood pressure discrepancy in coarctation of the aorta; its origin can be involved in subclavian steal syndrome with vertebral artery flow reversal.',
 facts:['Gives rise to the vertebral artery, internal thoracic artery, thyrocervical trunk, and costocervical trunk','Divided into three parts by the anterior scalene muscle','Becomes the axillary artery at the outer border of rib 1'],
 arteryOrigin:'Aortic arch directly (third branch)', arteryBranches:['Vertebral artery','Internal thoracic artery','Thyrocervical trunk','Costocervical trunk'], areasSupplied:'Posterior brain/spinal cord, anterior chest wall, and the upper limb'},

{id:'w1-left-common-carotid',name:'Left Common Carotid Artery',category:'Artery',week:1,region:'Neck',wiki:'Common carotid artery',
 description:'Second branch of the aortic arch, arising directly from the arch and ascending in the neck to bifurcate into internal and external carotid arteries at the C4 level.',
 clinical:'Assessed with carotid duplex ultrasound for atherosclerotic plaque, a major stroke risk factor; the carotid sinus at its bifurcation contains baroreceptors regulating blood pressure.',
 facts:['Has no branches in the neck until its terminal bifurcation','Lies within the carotid sheath alongside the internal jugular vein and vagus nerve','Bifurcates at approximately the C4 level/upper border of the thyroid cartilage'],
 arteryOrigin:'Aortic arch directly (second branch)', arteryBranches:['Internal carotid artery','External carotid artery (terminal branches only)'], areasSupplied:'Head and neck'},

{id:'w1-azygos-vein',name:'Azygos Vein',category:'Vein',week:1,region:'Posterior mediastinum',wiki:'Azygos vein',
 description:'Unpaired vein ascending on the right side of the vertebral column in the posterior mediastinum, draining most right posterior intercostal veins and arching over the root of the right lung to join the SVC.',
 clinical:'Provides an important collateral pathway between the SVC and IVC systems; becomes markedly dilated in IVC obstruction, visible on chest imaging.',
 facts:['Arches anteriorly over the root of the right lung to drain into the superior vena cava','Receives the hemiazygos and accessory hemiazygos veins, which cross the midline to join it','Connects the SVC and IVC systems, an important collateral route'],
 veinDrainage:'Right posterior intercostal veins, hemiazygos and accessory hemiazygos veins, bronchial, esophageal, and mediastinal veins',
 veinTributaries:['Right posterior intercostal veins 4-11','Hemiazygos vein','Accessory hemiazygos vein','Right subcostal vein','Right ascending lumbar vein'],
 veinTermination:'Superior vena cava, arching over the root of the right lung'},

{id:'w1-hemiazygos-vein',name:'Hemiazygos Vein',category:'Vein',week:1,region:'Posterior mediastinum',wiki:'Hemiazygos vein',
 description:'Vein ascending on the left side of the vertebral column, draining the lower left posterior intercostal veins before crossing the midline (around T9) to join the azygos vein.',
 clinical:'Forms part of the azygos venous collateral pathway; variable anatomy is relevant during thoracic surgery.',
 facts:['Drains the lower 4-5 left posterior intercostal spaces','Crosses the midline posterior to the aorta, esophagus, and thoracic duct','Superior counterpart, the accessory hemiazygos vein, drains the upper left intercostal spaces'],
 veinDrainage:'Lower left posterior intercostal veins and the left subcostal vein',
 veinTributaries:['Left posterior intercostal veins 9-11','Left subcostal vein','Sometimes the left ascending lumbar vein'],
 veinTermination:'Crosses the midline to join the azygos vein (around T9)'},

{id:'w1-svc',name:'Superior Vena Cava',category:'Vein',week:1,region:'Mediastinum',wiki:'Superior vena cava',
 description:'Large vein formed by the union of the right and left brachiocephalic veins, draining venous blood from the head, neck, upper limbs, and thorax into the right atrium.',
 clinical:'SVC syndrome (obstruction, classically from lung cancer or a mediastinal mass) causes facial/upper limb swelling, distended neck veins, and cyanosis.',
 facts:['Formed by union of the two brachiocephalic veins posterior to the right first costal cartilage','Receives the azygos vein just before entering the pericardium','Lacks valves'],
 veinDrainage:'Head, neck, upper limbs, and thoracic wall',
 veinTributaries:['Right and left brachiocephalic veins','Azygos vein'],
 veinTermination:'Right atrium'},

{id:'w1-ivc',name:'Inferior Vena Cava',category:'Vein',week:1,region:'Abdomen/mediastinum',wiki:'Inferior vena cava',
 description:'Largest vein in the body, formed by the union of the common iliac veins, ascending along the right side of the vertebral column/abdominal aorta to pierce the diaphragm at T8 and drain into the right atrium.',
 clinical:'IVC filters prevent pulmonary embolism from lower limb DVT; compression by a gravid uterus can cause supine hypotensive syndrome in pregnancy.',
 facts:['Pierces the diaphragm\'s caval opening at T8','Receives hepatic veins directly, unlike the portal system','Formed by union of the common iliac veins at approximately L5'],
 veinDrainage:'Lower limbs, pelvis, abdominal viscera, and abdominal wall',
 veinTributaries:['Common iliac veins','Renal veins','Gonadal veins (right directly, left usually via renal vein)','Hepatic veins','Lumbar veins','Inferior phrenic veins'],
 veinTermination:'Right atrium'},

{id:'w1-thoracic-duct',name:'Thoracic Duct',category:'Lymph',week:1,region:'Posterior mediastinum',wiki:'Thoracic duct',
 description:'Largest lymphatic vessel in the body, arising from the cisterna chyli and ascending through the thorax to drain lymph from most of the body into the venous system.',
 clinical:'Iatrogenic injury during neck/thoracic surgery causes chylothorax (chyle leak into the pleural cavity); obstruction can cause chylous ascites or lymphedema.',
 facts:['Drains the lower limbs, pelvis, abdomen, left hemithorax, left upper limb, and left head/neck — about 3/4 of the body','Ascends through the aortic hiatus alongside the aorta and azygos vein','Empties into the venous system at the left venous angle (left subclavian + left internal jugular vein junction)']},

{id:'w1-cisterna-chyli',name:'Cisterna Chyli',category:'Lymph',week:1,region:'Retroperitoneum',wiki:'Cisterna chyli',
 description:'Dilated lymphatic sac at the lower end of the thoracic duct, located anterior to L1-L2, receiving lymph from the lumbar and intestinal lymph trunks.',
 clinical:'Relevant in understanding the route of metastatic spread from abdominal/pelvic malignancies into the systemic circulation via the thoracic duct.',
 facts:['Receives the paired lumbar lymphatic trunks and the intestinal lymphatic trunk','Located just posterior/right of the aorta, near the aortic hiatus origin','Continues superiorly as the thoracic duct']},

{id:'w1-pleura',name:'Pleura',category:'Fascia',week:1,region:'Thoracic cavity',wiki:'Pleura',
 description:'Double-layered serous membrane surrounding each lung, comprising the visceral pleura (adherent to the lung surface) and parietal pleura (lining the thoracic wall, mediastinum, and diaphragm), separated by a thin film of fluid.',
 clinical:'Pneumothorax (air in the pleural space) collapses the lung; pleural effusion can be drained by thoracentesis in the costodiaphragmatic recess, the most dependent part of the pleural cavity.',
 facts:['Visceral pleura has no somatic sensory innervation (pain-insensitive)','Parietal pleura is innervated by the phrenic nerve (mediastinal/diaphragmatic parts) and intercostal nerves (costal part)','Costodiaphragmatic recess is the lowest point of the pleural cavity, a common site for fluid accumulation']},

{id:'w1-pericardium',name:'Pericardium',category:'Fascia',week:1,region:'Mediastinum',wiki:'Pericardium',
 description:'Fibroserous sac enclosing the heart, composed of an outer fibrous pericardium and an inner serous pericardium (parietal and visceral/epicardial layers).',
 clinical:'Cardiac tamponade occurs when fluid or blood accumulates faster than the sac can stretch, compressing the heart — a medical emergency treated with pericardiocentesis.',
 facts:['Fibrous pericardium anchors the heart to the diaphragm and great vessels, limiting overdistension','Transverse and oblique pericardial sinuses are surgical landmarks used to control the great vessels during cardiac bypass','Phrenic nerves run within the fibrous pericardium en route to the diaphragm']},

{id:'w1-prevertebral-fascia',name:'Prevertebral Fascia',category:'Fascia',week:1,region:'Neck/posterior mediastinum',wiki:'Prevertebral fascia',
 description:'Deep cervical fascia layer covering the prevertebral and scalene muscles anterior to the vertebral column, extending from the skull base into the posterior mediastinum/thorax.',
 clinical:'Infections in the prevertebral space can track inferiorly within this fascial plane into the posterior mediastinum, causing mediastinitis.',
 facts:['Forms the floor of the posterior triangle of the neck','Encloses the scalene muscles, forming the axillary sheath around the brachial plexus and subclavian artery','Continuous inferiorly with fascia over the anterior longitudinal ligament in the thorax']},

{id:'w1-sibsons-fascia',name:"Sibson's Fascia",category:'Fascia',week:1,region:'Thoracic inlet',wiki:'Suprapleural membrane',
 description:'Thickened dome of fascia (the suprapleural membrane) stretching over the cervical pleura/apex of the lung, attaching to the internal border of rib 1 and the transverse process of C7.',
 clinical:'Resists the negative intrathoracic pressure that would otherwise pull the lung apex upward with each breath; apical lung (Pancoast) tumors can invade through it to involve the brachial plexus and sympathetic chain.',
 facts:['Also called the suprapleural membrane','Sometimes reinforced by fibers described as "Sibson\'s muscle" (scalenus minimus)','Attaches to the inner border of the first rib and the transverse process of C7']},
/*WEEK1_END*/
/*WEEK2_START*/
{id:'w2-lumbar-body',name:'Lumbar Vertebral Body',category:'Bone',week:2,region:'Lumbar spine',wiki:'Lumbar vertebrae',
 description:'Large, kidney-shaped body of a lumbar vertebra, the largest and most robust vertebral bodies in the spine, adapted to bear the greatest compressive load.',
 clinical:'Compression fractures most often occur here (e.g. osteoporotic fracture of L1) due to the high axial load this region bears.',
 facts:['Progressively increases in size from L1 to L5 to match increasing load','Lacks costal facets, unlike thoracic vertebrae','Height loss with age/osteoporosis contributes to kyphosis'],
 boneLandmarks:['Kidney-shaped body, no costal facets'], boneArticulations:['Adjacent vertebral bodies via intervertebral discs'],
 boneAttachments:['Anterior and posterior longitudinal ligaments, psoas major']},

{id:'w2-mammillary-process',name:'Mammillary Process',category:'Bone',week:2,region:'Lumbar vertebra',wiki:'Mammillary process',
 description:'Small rounded tubercle on the posterior border of each superior articular process of a lumbar vertebra.',
 clinical:'Used as a surgical landmark for the pedicle screw entry point in lumbar spinal fixation.',
 facts:['Unique to lumbar vertebrae','Gives attachment to multifidus; the medial branch of the dorsal ramus passes nearby','Paired, one per superior articular process'],
 boneLandmarks:['Small posterior tubercle on the superior articular process'], boneArticulations:['None — attachment site, not an articulation'],
 boneAttachments:['Multifidus, intertransversarii mediales']},

{id:'w2-accessory-process',name:'Accessory Process',category:'Bone',week:2,region:'Lumbar vertebra',wiki:'Accessory process',
 description:'Small bony projection on the posterior surface of the base of the transverse process of a lumbar vertebra.',
 clinical:'A useful feature confirming lumbar vertebral identity; an elongated process can rarely be mistaken for a rib remnant.',
